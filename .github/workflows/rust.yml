name: Rust

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.lock"
      - ".cargo/**"
      - "**/.cargo/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".rustfmt.toml"
      - "clippy.toml"
      - ".clippy.toml"
      - ".github/workflows/rust.yml"
      - "scripts/lib/core-startup-availability.test.mjs"
      - "scripts/lib/runtime-camp-files-root.mjs"
permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Rust fmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  fast-tests:
    name: Rust fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run fast Rust tests
        run: cargo test -p rovai-core --lib

      - name: Set up Node.js for real Core startup regression
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26

      - name: Verify authority survives optional startup failures
        run: |
          cargo build -p rovai-core --bins
          node --test scripts/lib/core-startup-availability.test.mjs

  db-smoke:
    name: Rust database smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run database smoke tests
        run: >-
          cargo test -p rovai-core --features slow-tests --lib slow_tests::

  windows-x64-check:
    name: Windows x64 compile gate
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check all Windows targets
        run: >-
          cargo check --workspace --all-targets
          --target x86_64-pc-windows-msvc

      - name: Exercise Windows managed process ownership
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          managed_process

      - name: Exercise Windows private storage admission
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          core_data_dir_lock

      - name: Exercise Windows data-root layout
        run: >-
          cargo test -p rovai-core --all-targets
          --target x86_64-pc-windows-msvc
          windows_data_root

      - name: Exercise Core-independent Windows bootstrap storage
        run: >-
          cargo test -p rovai-core --all-targets
          --target x86_64-pc-windows-msvc
          windows_bootstrap_root

      - name: Exercise Windows attachment traversal
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          windows_attachment

      - name: Exercise Windows CLI attachment snapshots
        run: >-
          cargo test -p rovai-core --bin rovai
          --target x86_64-pc-windows-msvc
          send_attachments

      - name: Exercise Windows Skill Library
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          windows_skill_library

      - name: Exercise Windows Skill projection lifecycle
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          windows_skill_projection

      - name: Exercise Windows Named Pipe transport
        run: >-
          cargo test -p rovai-core --all-targets
          --target x86_64-pc-windows-msvc
          windows_named_pipe

      - name: Exercise Windows private JSON replacement
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          private_json_replacement
