name: Rust

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.lock"
      - ".cargo/**"
      - "**/.cargo/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".rustfmt.toml"
      - "clippy.toml"
      - ".clippy.toml"
      - ".github/workflows/rust.yml"
permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Rust fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  fast-tests:
    name: Rust fast tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run fast Rust tests
        run: cargo test -p rovai-core --lib

  db-smoke:
    name: Rust database smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run database smoke tests
        run: >-
          cargo test -p rovai-core --features slow-tests --lib slow_tests::

  windows-x64-check:
    name: Windows x64 compile gate
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check all Windows targets
        run: >-
          cargo check --workspace --all-targets
          --target x86_64-pc-windows-msvc

      - name: Exercise Windows managed process ownership
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          managed_process

      - name: Exercise Windows private storage admission
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          core_data_dir_lock

      - name: Exercise Windows data-root layout
        run: >-
          cargo test -p rovai-core --all-targets
          --target x86_64-pc-windows-msvc
          windows_data_root

      - name: Exercise Windows attachment traversal
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          windows_attachment
