name: Full check

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        type: choice
        default: full
        options:
          - full
          - server
      server_target:
        description: Native Server target (only for server scope)
        type: choice
        default: all
        options:
          - all
          - macos-arm64
          - macos-x64
          - windows-x64
          - linux-x64

permissions:
  contents: read

concurrency:
  group: full-check-${{ github.ref }}-${{ inputs.scope }}-${{ inputs.server_target || 'all' }}
  cancel-in-progress: true

jobs:
  linux-full:
    if: inputs.scope != 'server'
    name: Linux full
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full Node checks
        run: |
          pnpm typecheck
          pnpm test

      - name: Run real Electron integration suite
        env:
          ROVAI_REQUIRE_ELECTRON_INTEGRATION: '1'
        run: xvfb-run -a pnpm test:desktop:integration

  rust-full:
    if: inputs.scope != 'server'
    name: Rust full
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run all-features Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run all-features Rust tests
        run: cargo test --workspace --all-features

      - name: Run database smoke tests
        run: "cargo test -p rovai-core --features slow-tests --lib slow_tests::"

  windows-full:
    if: inputs.scope != 'server'
    name: Windows full
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check all Windows targets
        run: >-
          cargo check --workspace --all-targets
          --target x86_64-pc-windows-msvc

      - name: Exercise Windows managed process ownership
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          managed_process

      - name: Exercise Windows private storage admission
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          core_data_dir_lock

      - name: Exercise Windows data-root layout
        run: >-
          cargo test -p rovai-core --all-targets
          --target x86_64-pc-windows-msvc
          windows_data_root

      - name: Exercise Core-independent Windows bootstrap storage
        run: >-
          cargo test -p rovai-core --all-targets
          --target x86_64-pc-windows-msvc
          windows_bootstrap_root

      - name: Exercise Windows attachment traversal
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          windows_attachment

      - name: Exercise Windows CLI attachment snapshots
        run: >-
          cargo test -p rovai-core --bin rovai
          --target x86_64-pc-windows-msvc
          send_attachments

      - name: Exercise Windows Skill Library
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          windows_skill_library

      - name: Exercise Windows Skill projection lifecycle
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          windows_skill_projection

      - name: Exercise Windows Named Pipe transport
        run: >-
          cargo test -p rovai-core --all-targets
          --target x86_64-pc-windows-msvc
          windows_named_pipe

      - name: Exercise Windows private JSON replacement
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          private_json_replacement

      - name: Exercise Windows MCP configuration permissions
        run: >-
          cargo test -p rovai-core --features slow-tests --lib
          --target x86_64-pc-windows-msvc
          mcp::slow_tests::

  server-native:
    name: Server preview / ${{ matrix.target }}
    if: inputs.scope == 'server'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON('{"all":["macos-arm64","macos-x64","windows-x64","linux-x64"],"macos-arm64":["macos-arm64"],"macos-x64":["macos-x64"],"windows-x64":["windows-x64"],"linux-x64":["linux-x64"]}')[inputs.server_target || 'all'] }}
    runs-on: ${{ fromJSON('{"macos-arm64":"macos-15","macos-x64":"macos-15-intel","windows-x64":"windows-2022","linux-x64":"ubuntu-24.04"}')[matrix.target] }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: server-${{ matrix.target }}
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native matching Host and WebUI package
        run: node scripts/build-server.mjs --target-key ${{ matrix.target }}
      - name: Verify credential state transitions
        run: cargo test -p rovai-web
      - name: Verify native process and private storage seams
        run: |
          cargo test -p rovai-core --lib managed_process
          cargo test -p rovai-core --lib core_data_dir_lock
      - name: Verify packaged Host and shared Web lifecycle
        env:
          ROVAI_HOST_BIN: ${{ github.workspace }}/out/server/${{ matrix.target }}/rovai-host${{ matrix.target == 'windows-x64' && '.exe' || '' }}
          ROVAI_WEB_UI: ${{ github.workspace }}/out/server/${{ matrix.target }}/web-ui
        run: node --test scripts/lib/host-lifecycle.test.mjs scripts/lib/host-web.test.mjs
      - name: Observe native managed Runtime file boundary
        run: |
          node -e "require('node:fs').mkdirSync('out/server-evidence', { recursive: true })"
          cargo run --quiet -p rovai-core --example host_runtime_boundary_probe > out/server-evidence/${{ matrix.target }}.json
          node -e "const r=JSON.parse(require('node:fs').readFileSync('out/server-evidence/${{ matrix.target }}.json','utf8')); console.log(JSON.stringify(r)); if (!r.privateFileIsolationSatisfied || !r.observation.authorizedWorkspaceWritable || !r.observation.descendant.authorizedWorkspaceWritable) process.exit(2)"
      - name: Upload native boundary observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rovai-server-boundary-${{ matrix.target }}-${{ github.sha }}
          path: out/server-evidence/${{ matrix.target }}.json
          if-no-files-found: warn
          retention-days: 3
      - name: Upload native preview package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rovai-server-preview-${{ matrix.target }}-${{ github.sha }}
          path: out/server/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 3
