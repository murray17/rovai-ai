name: Full check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-full:
    name: Linux full
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full Node checks
        run: |
          pnpm typecheck
          pnpm test

      - name: Run real Electron integration suite
        run: xvfb-run -a pnpm test:desktop:integration

  rust-full:
    name: Rust full
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run all-features Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run all-features Rust tests
        run: cargo test --workspace --all-features

      - name: Run database smoke tests
        run: "cargo test -p rovai-core --features slow-tests --lib slow_tests::"

  windows-full:
    name: Windows full
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check all Windows targets
        run: >-
          cargo check --workspace --all-targets
          --target x86_64-pc-windows-msvc

      - name: Exercise Windows managed process ownership
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          managed_process

      - name: Exercise Windows private storage admission
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          core_data_dir_lock

      - name: Exercise Windows data-root layout
        run: >-
          cargo test -p rovai-core --all-targets
          --target x86_64-pc-windows-msvc
          windows_data_root

      - name: Exercise Core-independent Windows bootstrap storage
        run: >-
          cargo test -p rovai-core --all-targets
          --target x86_64-pc-windows-msvc
          windows_bootstrap_root

      - name: Exercise Windows attachment traversal
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          windows_attachment

      - name: Exercise Windows CLI attachment snapshots
        run: >-
          cargo test -p rovai-core --bin rovai
          --target x86_64-pc-windows-msvc
          send_attachments

      - name: Exercise Windows Skill Library
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          windows_skill_library

      - name: Exercise Windows Skill projection lifecycle
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          windows_skill_projection

      - name: Exercise Windows Named Pipe transport
        run: >-
          cargo test -p rovai-core --all-targets
          --target x86_64-pc-windows-msvc
          windows_named_pipe

      - name: Exercise Windows private JSON replacement
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          private_json_replacement
