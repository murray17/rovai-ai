name: Signed macOS release acceptance

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  native-upgrade:
    name: Signed install and upgrade / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.20.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Download exact public baseline and signed build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ROVAI_RELEASE_ARCH: ${{ matrix.arch }}
          ROVAI_RELEASE_SOURCE: 2a09837a89bcf30d2efab20315cfa18947d3e8cc
          ROVAI_RELEASE_RUN: '45932450887'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'murray17/rovai-ai'
          old="$RUNNER_TEMP/rv517-baseline"
          candidate="$RUNNER_TEMP/rv517-candidate"
          mkdir -p "$old" "$candidate"
          base='https://github.com/murray17/rovai-ai/releases/download/v0.5.16'
          curl -fsSL --retry 3 "$base/SHA256SUMS.txt" -o "$old/SHA256SUMS.txt"
          archive="Rovai-AI-0.5.16-$ROVAI_RELEASE_ARCH"
          curl -fsSL --retry 3 "$base/$archive.dmg" -o "$old/$archive.dmg" &
          dmg_pid=$!
          curl -fsSL --retry 3 "$base/$archive.zip" -o "$old/$archive.zip" &
          zip_pid=$!
          curl -fsSL --retry 3 "$base/$archive.zip.blockmap" -o "$old/$archive.zip.blockmap" &
          map_pid=$!
          wait "$dmg_pid"
          wait "$zip_pid"
          wait "$map_pid"
          (
            cd "$old"
            awk -v name="$archive" '$2 == (name ".zip") || $2 == (name ".dmg") || $2 == (name ".zip.blockmap")' SHA256SUMS.txt > checked-sums
            test "$(wc -l < checked-sums | tr -d ' ')" = 3
            shasum -a 256 --check checked-sums
          )
          actual_source=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ROVAI_RELEASE_RUN" --jq '.head_sha')
          test "$actual_source" = "$ROVAI_RELEASE_SOURCE"
          artifact="rovai-macos-$ROVAI_RELEASE_ARCH-signed"
          for round in {1..70}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ROVAI_RELEASE_RUN/artifacts" --jq '.artifacts[].name' | grep -Fx "$artifact"; then
              break
            fi
            sleep 12
          done
          gh run download "$ROVAI_RELEASE_RUN" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$candidate"
      - name: Exercise clean DMG install and three real signed update paths
        shell: bash
        run: |
          node scripts/smoke-macos-signed-release.mjs "$RUNNER_TEMP/rv517-baseline" "$RUNNER_TEMP/rv517-candidate"
