name: Full check

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        type: choice
        default: full
        options:
          - full
          - server
          - server-updates
      server_target:
        description: Native Server target (server or server-updates scope)
        type: choice
        default: all
        options:
          - all
          - macos-arm64
          - macos-x64
          - windows-x64
          - linux-x64
      server_release_draft:
        description: Assemble a GitHub draft Release after all native targets pass (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: full-check-${{ github.ref }}-${{ inputs.scope }}-${{ inputs.server_target || 'all' }}
  cancel-in-progress: true

jobs:
  linux-full:
    if: inputs.scope == 'full'
    name: Linux full
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full Node checks
        run: |
          pnpm typecheck
          pnpm test

      - name: Run real Electron integration suite
        env:
          ROVAI_REQUIRE_ELECTRON_INTEGRATION: '1'
        run: xvfb-run -a pnpm test:desktop:integration

  rust-full:
    if: inputs.scope == 'full'
    name: Rust full
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run all-features Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run all-features Rust tests
        run: cargo test --workspace --all-features

  windows-full:
    if: inputs.scope == 'full'
    name: Windows full
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check all Windows targets
        run: >-
          cargo check --workspace --all-targets
          --target x86_64-pc-windows-msvc

      - name: Exercise Windows managed process ownership
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          managed_process

      - name: Exercise Windows private storage admission
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          core_data_dir_lock

      - name: Exercise Windows data-root layout
        run: >-
          cargo test -p rovai-core --all-targets
          --target x86_64-pc-windows-msvc
          windows_data_root

      - name: Exercise Core-independent Windows bootstrap storage
        run: >-
          cargo test -p rovai-core --all-targets
          --target x86_64-pc-windows-msvc
          windows_bootstrap_root

      - name: Exercise Windows attachment traversal
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          windows_attachment

      - name: Exercise Windows CLI attachment snapshots
        run: >-
          cargo test -p rovai-core --bin rovai
          --target x86_64-pc-windows-msvc
          send_attachments

      - name: Exercise Windows Skill Library
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          windows_skill_library

      - name: Exercise Windows Skill projection lifecycle
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          windows_skill_projection

      - name: Exercise Windows Named Pipe transport
        run: >-
          cargo test -p rovai-core --all-targets
          --target x86_64-pc-windows-msvc
          windows_named_pipe

      - name: Exercise Windows private JSON replacement
        run: >-
          cargo test -p rovai-core --lib
          --target x86_64-pc-windows-msvc
          private_json_replacement

      - name: Exercise Windows MCP configuration permissions
        run: >-
          cargo test -p rovai-core --features slow-tests --lib
          --target x86_64-pc-windows-msvc
          mcp::slow_tests::

  server-updates:
    name: Server update tests / ${{ matrix.target }}
    if: inputs.scope == 'server-updates'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON('{"all":["macos-arm64","macos-x64","windows-x64","linux-x64"],"macos-arm64":["macos-arm64"],"macos-x64":["macos-x64"],"windows-x64":["windows-x64"],"linux-x64":["linux-x64"]}')[inputs.server_target || 'all'] }}
    runs-on: ${{ fromJSON('{"macos-arm64":"macos-15","macos-x64":"macos-15-intel","windows-x64":"windows-2022","linux-x64":"ubuntu-22.04"}')[matrix.target] }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: server-${{ matrix.target }}
      - name: Verify credentials and content versions
        id: web_check
        run: cargo test --locked -p rovai-web
      - name: Verify updater and process handoff
        if: ${{ !cancelled() && (steps.web_check.conclusion == 'success' || steps.web_check.conclusion == 'failure') }}
        run: cargo test --locked -p rovai-host --lib server_updates
      - name: Verify Windows resolved-file boundary
        if: ${{ matrix.target == 'windows-x64' && !cancelled() && (steps.web_check.conclusion == 'success' || steps.web_check.conclusion == 'failure') }}
        run: cargo test --locked -p rovai-core --lib windows_attachment_directory_rejects_junctions_and_cleans_only_owned_tree

  server-native:
    name: Server preview / ${{ matrix.target }}
    if: inputs.scope == 'server'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON('{"all":["macos-arm64","macos-x64","windows-x64","linux-x64"],"macos-arm64":["macos-arm64"],"macos-x64":["macos-x64"],"windows-x64":["windows-x64"],"linux-x64":["linux-x64"]}')[inputs.server_target || 'all'] }}
    runs-on: ${{ fromJSON('{"macos-arm64":"macos-15","macos-x64":"macos-15-intel","windows-x64":"windows-2022","linux-x64":"ubuntu-22.04"}')[matrix.target] }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: server-${{ matrix.target }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native matching Host and WebUI package
        run: node scripts/build-server.mjs --target-key ${{ matrix.target }}
      - name: Verify Linux ABI rejection cases
        if: matrix.target == 'linux-x64'
        run: node --test scripts/lib/linux-server-abi.test.mjs
      - name: Verify credential state transitions
        run: cargo test -p rovai-web
      - name: Verify Server updater state transitions
        run: cargo test -p rovai-host --lib server_updates
      - name: Verify native process and private storage seams
        run: |
          cargo test -p rovai-core --lib managed_process
          cargo test -p rovai-core --lib antigravity::tests::
          cargo test -p rovai-core --lib codebuddy_launch_preserves_native_default_and_explicit_model_selection
          node --test scripts/test-zcode-owner.mjs
          cargo test -p rovai-core --lib core_data_dir_lock
          cargo test -p rovai-core --lib storage_layout
      - name: Verify packaged Host and shared Web lifecycle
        env:
          ROVAI_HOST_BIN: ${{ github.workspace }}/out/server/${{ matrix.target }}/rovai-host${{ matrix.target == 'windows-x64' && '.exe' || '' }}
          ROVAI_SERVER_BIN: ${{ github.workspace }}/out/server/${{ matrix.target }}/rovai-server${{ matrix.target == 'windows-x64' && '.exe' || '' }}
          ROVAI_SERVER_RELEASE_DIR: ${{ github.workspace }}/out/server/releases/${{ matrix.target }}
          ROVAI_WEB_UI: ${{ github.workspace }}/out/server/${{ matrix.target }}/web-ui
        run: node --test scripts/lib/host-lifecycle.test.mjs scripts/lib/host-web.test.mjs scripts/lib/host-web-channels.test.mjs scripts/lib/server-entry.test.mjs scripts/lib/server-install.test.mjs
      - name: Upload checksummed native archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rovai-server-archive-${{ matrix.target }}-${{ github.sha }}
          path: out/server/releases/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7
      - name: Observe native managed Runtime file boundary
        # Single-Owner trusted Host: keep same-UID observations as risk evidence,
        # not a strong-isolation release gate. Workspace access must still work.
        run: |
          node -e "require('node:fs').mkdirSync('out/server-evidence', { recursive: true })"
          cargo run --quiet -p rovai-core --example host_runtime_boundary_probe > out/server-evidence/${{ matrix.target }}.json
          node -e "const r=JSON.parse(require('node:fs').readFileSync('out/server-evidence/${{ matrix.target }}.json','utf8')); console.log(JSON.stringify(r)); if (!r.observation.authorizedWorkspaceWritable || !r.observation.descendant.authorizedWorkspaceWritable) process.exit(2)"
      - name: Upload native boundary observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rovai-server-boundary-${{ matrix.target }}-${{ github.sha }}
          path: out/server-evidence/${{ matrix.target }}.json
          if-no-files-found: warn
          retention-days: 3

      - name: Upload native preview package
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rovai-server-preview-${{ matrix.target }}-${{ github.sha }}
          path: out/server/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 3

  server-linux-os:
    name: Linux Server OS / ${{ matrix.os }}
    needs: server-native
    if: inputs.scope == 'server' && (inputs.server_target == 'all' || inputs.server_target == 'linux-x64')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rovai-server-archive-linux-x64-${{ github.sha }}
          path: out/server-downloads
      - name: Install the unchanged Ubuntu 22.04 archive
        shell: bash
        run: |
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          sh scripts/install-server.sh --version "$version" --from-dir "$PWD/out/server-downloads" --prefix "$RUNNER_TEMP/rovai-linux" --bin-dir "$RUNNER_TEMP/rovai-linux-bin" --no-modify-path
      - name: Exercise Server with no development tools on its PATH
        run: python3 scripts/smoke-linux-server.py "$RUNNER_TEMP/rovai-linux/current" --expected-source "$GITHUB_SHA" --output out/server-evidence/${{ matrix.os }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rovai-server-os-${{ matrix.os }}-${{ github.sha }}
          path: out/server-evidence/${{ matrix.os }}.json
          if-no-files-found: error

  server-linux-debian:
    name: Linux Server OS / Debian 12 VM
    needs: server-native
    if: inputs.scope == 'server' && (inputs.server_target == 'all' || inputs.server_target == 'linux-x64')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rovai-server-archive-linux-x64-${{ github.sha }}
          path: out/server-downloads
      - name: Prepare Debian VM tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Exercise the unchanged archive inside Debian 12
        run: bash scripts/smoke-debian-server-vm.sh out/server-downloads "$GITHUB_SHA" out/server-evidence/debian-12.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rovai-server-os-debian-12-${{ github.sha }}
          path: out/server-evidence/debian-12.json
          if-no-files-found: error

  server-release-draft:
    name: Assemble native Server draft Release
    needs: [server-native, server-linux-os, server-linux-debian]
    if: inputs.scope == 'server' && inputs.server_release_draft && inputs.server_target == 'all' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rovai-server-archive-*-${{ github.sha }}
          path: out/server-downloads
      - name: Check matched native archives and assemble checksums
        run: node scripts/prepare-server-release.mjs out/server-downloads out/server-release
      - name: Create an unpublished draft without changing the default channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          gh release create "server-v$version" --draft --target "$GITHUB_SHA" --title "Rovai Server $version" --notes-file out/server-release/RELEASE-NOTES.md out/server-release/*.tar.gz out/server-release/*.zip out/server-release/SHA256SUMS scripts/install-server.sh scripts/install-server.ps1
