name: Desktop availability and context bridge

on:
  pull_request:
    paths:
      - "apps/desktop/src/preload/**"
      - "apps/desktop/src/main/**"
      - "apps/desktop/src/renderer/src/App*"
      - "apps/desktop/src/renderer/src/CampNavigation*"
      - "apps/desktop/src/renderer/src/CampWorkspace*"
      - "apps/desktop/src/renderer/src/ExecutionAvatarRail*"
      - "apps/desktop/src/renderer/src/PendingCampInputs*"
      - "apps/desktop/src/renderer/src/startup-location*"
      - "apps/desktop/src/renderer/src/CoreSubsystemNotice*"
      - "apps/desktop/src/renderer/src/styles.css"
      - "apps/desktop/src/renderer/src/error-message*"
      - "apps/desktop/src/renderer/src/StructuredMentionComposer*"
      - "apps/desktop/src/renderer/src/structured-mention-model*"
      - "apps/desktop/src/renderer/src/FilePreview*"
      - "apps/desktop/src/renderer/src/FileChangesPreview*"
      - "apps/desktop/src/renderer/src/file-preview-*"
      - "apps/desktop/src/renderer/src/file-changes-presentation*"
      - "apps/desktop/src/renderer/src/CampMemberFast*"
      - "packages/contracts/**"
      - "scripts/lib/rovai-request-context-bridge.test.mjs"
      - "scripts/fixtures/rovai-request-context-bridge.cjs"
      - "scripts/lib/structured-mention-composer.test.mjs"
      - "scripts/fixtures/structured-mention-composer/**"
      - "scripts/lib/camp-composer-continuation.test.mjs"
      - "scripts/fixtures/camp-composer-continuation/**"
      - "scripts/lib/desktop-startup-presentation.test.mjs"
      - "scripts/fixtures/desktop-startup-presentation/**"
      - "scripts/lib/file-preview-layout.test.mjs"
      - "scripts/fixtures/file-preview-layout/**"
      - "scripts/lib/camp-fast-layout.test.mjs"
      - "scripts/fixtures/camp-fast-layout/**"
      - "scripts/lib/execution-avatar-rail.test.mjs"
      - "scripts/fixtures/execution-avatar-rail/**"
      - "scripts/lib/approval-dock.test.mjs"
      - "scripts/fixtures/approval-dock/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-bridge.yml"

permissions:
  contents: read

concurrency:
  group: desktop-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26

      - name: Install pnpm and dependencies
        run: |
          npm install --global pnpm@11.20.0
          pnpm install --frozen-lockfile

      - name: Verify real Electron contextBridge and Renderer error reading
        run: |
          pnpm typecheck
          xvfb-run -a pnpm test:desktop-bridge
          xvfb-run -a pnpm test:composer-input
          xvfb-run -a pnpm test:composer-continuation
          xvfb-run -a pnpm test:startup-presentation
          xvfb-run -a pnpm test:file-preview-layout
          xvfb-run -a pnpm test:camp-fast-layout
          xvfb-run -a pnpm test:execution-avatar-rail
          xvfb-run -a pnpm test:approval-dock
          pnpm exec vitest run apps/desktop/src/main/desktop-session.test.ts apps/desktop/src/renderer/src/CampNavigationPagination.test.ts
          pnpm exec vitest run apps/desktop/src/renderer/src/error-message.test.ts apps/desktop/src/main/core-client.test.ts apps/desktop/src/main/windows-data-root.test.ts apps/desktop/src/main/windows-bootstrap.test.ts apps/desktop/src/renderer/src/CoreSubsystemNotice.test.ts apps/desktop/src/renderer/src/App.test.ts
