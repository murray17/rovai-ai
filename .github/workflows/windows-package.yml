name: Windows x64 package

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "build/**"
      - "crates/rovai-core/**"
      - "resources/**"
      - "scripts/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/windows-package.yml"
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "build/**"
      - "crates/rovai-core/**"
      - "resources/**"
      - "scripts/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/windows-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-package:
    name: Windows x64 unsigned package
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Install pnpm
        run: npm install --global pnpm@11.20.0

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.97.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify unsigned NSIS package
        run: pnpm dist:windows:x64

      - name: Upload unsigned package evidence
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rovai-windows-x64-unsigned-${{ github.sha }}
          path: |
            dist/Rovai-ai-*-x64.exe
            dist/Rovai-ai-*-x64.exe.blockmap
            dist/windows-release-manifest.json
            dist/windows-verification-report.txt
            dist/win-unpacked/**
          if-no-files-found: error
          retention-days: 7
