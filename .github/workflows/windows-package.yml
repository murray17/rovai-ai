name: Windows x64 package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-package:
    name: Windows x64 unsigned package
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install pnpm
        run: npm install --global pnpm@11.20.0

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.97.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify unsigned NSIS package
        run: pnpm dist:windows:x64

      - name: Upload unsigned package evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rovai-windows-x64-unsigned-${{ github.sha }}
          path: |
            dist/Rovai-AI-*-x64.exe
            dist/Rovai-AI-*-x64.exe.blockmap
            dist/latest.yml
            dist/windows-release-manifest.json
            dist/windows-verification-report.txt
          if-no-files-found: error
          retention-days: 3
