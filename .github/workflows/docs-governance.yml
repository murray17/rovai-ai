name: Documentation governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docs-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-governance:
    name: docs-governance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository and PR base history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run repository tests including documentation snapshot checks
        run: pnpm test

      - name: Run diff-aware documentation freeze
        if: github.event_name == 'pull_request'
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm docs:check:ci

      - name: Run diff-aware documentation freeze for main push
        if: github.event_name == 'push'
        env:
          DOCS_BASE_REF: ${{ github.event.before }}
        run: pnpm docs:check:ci
