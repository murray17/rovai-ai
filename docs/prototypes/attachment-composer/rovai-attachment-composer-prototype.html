<!doctype html><meta charset="utf-8"><title>Rovai-ai Attachment Composer Prototype</title><body><p style="font-family:system-ui;padding:24px">正在加载设计稿…</p><script>(async()=>{const names=['payload-1.txt','payload-2.txt','payload-3.txt','payload-4.txt'];const parts=await Promise.all(names.map(n=>fetch(n).then(r=>{if(!r.ok)throw new Error(n+': '+r.status);return r.text()})));const b=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const s=new DecompressionStream('gzip');const t=await new Response(new Blob([b]).stream().pipeThrough(s)).text();document.open();document.write(t);document.close()})().catch(e=>document.body.innerHTML='<pre style="white-space:pre-wrap">'+e+'</pre>')</script>
