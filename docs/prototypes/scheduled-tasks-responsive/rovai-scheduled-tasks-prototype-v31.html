<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rovai AI · 定时任务交互稿 v31</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --rail-width: 270px;
      --canvas: #eceeef;
      --surface: #fbfbfa;
      --surface-raised: #ffffff;
      --surface-subtle: #f0f2f4;
      --surface-muted: #e7eaed;
      --surface-selected: #e9ecee;
      --surface-hover: #e8eaea;
      --surface-sunken: #e4e8eb;
      --conversation-surface: #ffffff;
      --input: #ffffff;
      --ink: #171b20;
      --muted: #616a73;
      --faint: #6e7382;
      --line: #dfe4e8;
      --line-strong: #c7cfd6;
      --control-line: #8b9389;
      --brand: #526f88;
      --brand-hover: #3d5874;
      --brand-contrast: #ffffff;
      --brand-soft: #e9eef3;
      --brand-ink: #405f7e;
      --rail: #f3f4f4;
      --rail-ink: #626b72;
      --rail-line: #dadde0;
      --rail-logo: #526f88;
      --success: #3e775c;
      --success-soft: #e7f1ea;
      --danger: #a24c46;
      --danger-soft: #f7e6e3;
      --attention: #8a6226;
      --attention-soft: #f8edda;
      --focus: #526f88;
      --focus-soft: rgba(82, 111, 136, .16);
      --overlay: rgba(28, 32, 43, .42);
      --shadow-float: 0 18px 56px rgba(38, 45, 58, .14);
      --identity-1: #a65f4a;
      --identity-2: #39777a;
      --identity-3: #74628f;
      --channel-feishu: #3370ff;
      --channel-dingtalk: #0b7cff;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { color: var(--ink); background: var(--canvas); font-size: 13px; }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled, input:disabled, select:disabled { cursor: default; opacity: .48; }
    :where(button, input, textarea, select, summary):focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    ::selection { color: var(--ink); background: var(--brand-soft); }
    svg { display: block; }

    .app-shell {
      display: grid;
      width: 100vw;
      height: 100vh;
      grid-template-columns: var(--rail-width) minmax(0, 1fr);
      overflow: hidden;
      background: var(--conversation-surface);
    }

    /* Current Rovai global rail */
    .unified-sidebar {
      position: relative;
      grid-column: 1;
      display: flex;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      padding: 0 10px 10px;
      border-right: 1px solid var(--rail-line);
      color: var(--rail-ink);
      background: var(--rail);
      user-select: none;
    }
    .unified-sidebar-drag { flex: 0 0 38px; -webkit-app-region: drag; }
    .unified-brand { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px 14px; }
    .rail-logo { display: flex; min-width: 0; height: 38px; align-items: center; gap: 10px; color: var(--rail-logo); }
    .rail-logo strong { color: var(--ink); font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
    .rail-logo-mark { flex: 0 0 auto; }
    .brand-rendezvous-point { fill: #d3a45f; stroke: var(--rail); stroke-width: .65; }
    .unified-primary-nav { display: grid; gap: 3px; margin-bottom: 12px; }
    .rail-button {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 34px;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      padding: 0 9px;
      border: 0;
      border-radius: 7px;
      color: var(--rail-ink);
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .rail-button:hover:not(:disabled) { color: var(--ink); background: var(--surface-muted); }
    .rail-button.active { color: var(--brand-ink); background: var(--surface-selected); }
    .rail-button.active .rail-label { font-weight: 500; }
    .rail-glyph { display: grid; width: 20px; height: 20px; flex: 0 0 20px; place-items: center; }
    .rail-glyph svg { width: 16px; height: 16px; }
    .rail-label { display: inline; min-width: 0; overflow: hidden; font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }

    .conversation-jump {
      display: flex;
      min-height: 32px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 4px;
      padding: 0 9px;
      border: 1px solid var(--rail-line);
      border-radius: 7px;
      color: var(--faint);
      background: color-mix(in srgb, var(--surface-raised) 76%, transparent);
      cursor: pointer;
      font-size: 11px;
    }
    .conversation-jump:hover { color: var(--ink); background: var(--surface-raised); }
    .conversation-jump kbd {
      min-width: 27px;
      padding: 1px 5px;
      border: 1px solid var(--rail-line);
      border-radius: 4px;
      color: var(--faint);
      background: var(--rail);
      font: 10px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: center;
    }
    .navigation-scroll { min-height: 0; flex: 1; overflow-y: auto; padding: 3px 1px 16px; }
    .navigation-scroll::-webkit-scrollbar,
    .task-list-scroll::-webkit-scrollbar,
    .editor-pane::-webkit-scrollbar { width: 10px; }
    .navigation-scroll::-webkit-scrollbar-thumb,
    .task-list-scroll::-webkit-scrollbar-thumb,
    .editor-pane::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: 999px; background: var(--surface-selected); background-clip: padding-box; }
    .navigation-section-title {
      display: grid;
      min-height: 34px;
      grid-template-columns: minmax(0, 1fr) 26px;
      align-items: center;
      padding: 0 0 3px;
      color: var(--rail-ink);
      font-size: 11px;
      font-weight: 600;
    }
    .section-create-button { display: grid; width: 24px; height: 24px; place-items: center; padding: 0; border: 0; border-radius: 5px; color: var(--faint); background: transparent; cursor: pointer; font-size: 17px; }
    .section-create-button:hover { color: var(--ink); background: var(--surface-muted); }
    .project-group { position: relative; min-width: 0; margin-bottom: 8px; }
    .project-heading {
      position: relative;
      display: grid;
      width: 100%;
      min-width: 0;
      min-height: 34px;
      grid-template-columns: 16px 18px minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
      padding: 5px 8px;
      border: 0;
      border-radius: 7px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .project-heading:hover { background: color-mix(in srgb, var(--surface-muted) 70%, transparent); }
    .project-chevron { color: var(--faint); transition: transform 120ms ease; }
    .project-group.collapsed .project-chevron { transform: rotate(-90deg); }
    .project-icon { display: grid; width: 18px; height: 18px; place-items: center; border: 1px solid var(--rail-line); border-radius: 5px; color: var(--brand-ink); background: var(--surface-raised); }
    .project-name { min-width: 0; overflow: hidden; font-size: 11.5px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .project-count { color: var(--faint); font: 9.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .conversation-list { display: grid; gap: 1px; padding-left: 25px; }
    .project-group.collapsed .conversation-list { display: none; }
    .conversation-row {
      display: grid;
      width: 100%;
      min-width: 0;
      min-height: 30px;
      grid-template-columns: 6px minmax(0, 1fr) 18px;
      align-items: center;
      gap: 7px;
      padding: 0 7px 0 8px;
      border: 0;
      border-radius: 6px;
      color: var(--rail-ink);
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .conversation-row:hover { color: var(--ink); background: var(--surface-hover); }
    .conversation-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--line-strong); }
    .conversation-dot.unread { background: var(--brand); }
    .conversation-title { min-width: 0; overflow: hidden; font-size: 10.5px; text-overflow: ellipsis; white-space: nowrap; }
    .conversation-tail { display: grid; width: 18px; height: 18px; place-items: center; color: var(--faint); }
    .conversation-tail svg { width: 13px; height: 13px; }
    .conversation-spinner { width: 12px; height: 12px; border: 1.5px solid color-mix(in srgb, var(--brand) 24%, transparent); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .unified-sidebar-footer { display: grid; flex: 0 0 auto; gap: 4px; padding-top: 8px; border-top: 1px solid var(--line); }

    /* Scheduled workspace: no page title bar */
    .workspace { grid-column: 2; min-width: 0; min-height: 0; overflow: hidden; background: var(--conversation-surface); }
    .scheduled-shell { display: grid; width: 100%; height: 100%; min-width: 0; min-height: 0; grid-template-columns: 248px minmax(0, 1fr); }

    .task-pane {
      display: grid;
      min-width: 0;
      min-height: 0;
      grid-template-rows: 38px auto auto minmax(0, 1fr);
      border-right: 1px solid var(--line);
      background: var(--surface);
    }
    .pane-drag-strip { min-height: 38px; -webkit-app-region: drag; }
    .task-toolbar { display: flex; min-width: 0; align-items: center; justify-content: space-between; gap: 8px; padding: 0 9px 7px; }
    .task-filter-group { display: flex; min-width: 0; align-items: center; gap: 2px; }
    .filter-button {
      min-height: 25px;
      padding: 3px 7px;
      border: 0;
      border-radius: 7px;
      color: var(--faint);
      background: transparent;
      cursor: pointer;
      font-size: 9.8px;
      white-space: nowrap;
    }
    .filter-button:hover { color: var(--ink); background: var(--surface-hover); }
    .filter-button.active { color: var(--ink); background: var(--surface-selected); }
    .task-search-shell {
      display: flex;
      min-height: 31px;
      align-items: center;
      gap: 7px;
      margin: 6px 11px 11px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--faint);
      background: var(--surface-raised);
    }
    .task-search-shell:focus-within { border-color: var(--line-strong); box-shadow: 0 0 0 2px var(--focus-soft); }
    .task-search-shell svg { width: 13px; height: 13px; flex: 0 0 13px; }
    .task-search-shell input { width: 100%; min-width: 0; padding: 0; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 10.2px; }
    .task-search-shell input::placeholder { color: color-mix(in srgb, var(--faint) 72%, transparent); }
    .primary-button,
    .quiet-button,
    .text-button {
      display: inline-flex;
      min-height: 30px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 10.5px;
      font-weight: 650;
      cursor: pointer;
    }
    .primary-button { border: 1px solid var(--brand); color: var(--brand-contrast); background: var(--brand); }
    .primary-button:hover:not(:disabled) { border-color: var(--brand-hover); background: var(--brand-hover); }
    .quiet-button { border: 1px solid var(--line-strong); color: var(--ink); background: var(--surface); }
    .quiet-button:hover:not(:disabled) { background: var(--surface-muted); }
    .text-button { min-height: 28px; padding: 4px 7px; border: 0; color: var(--muted); background: transparent; }
    .text-button:hover:not(:disabled) { color: var(--ink); background: var(--surface-muted); }
    .task-toolbar .primary-button { min-height: 27px; padding: 3px 9px; font-size: 10px; }
    .task-list-scroll { min-height: 0; overflow-y: auto; padding: 2px 8px 18px; }

    .scheduled-task-list { display: grid; gap: 2px; }
    .scheduled-task-row {
      position: relative;
      display: grid;
      width: 100%;
      min-width: 0;
      min-height: 52px;
      grid-template-columns: minmax(0, 1fr) 28px;
      align-items: center;
      gap: 10px;
      padding: 6px 8px 6px 10px;
      border: 0;
      border-radius: 7px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .scheduled-task-row:hover { background: var(--surface-hover); }
    .scheduled-task-row.active { background: var(--surface-selected); }
    .scheduled-task-copy { min-width: 0; }
    .scheduled-task-copy strong,
    .scheduled-task-copy small { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .scheduled-task-copy strong { color: var(--ink); font-size: 11px; font-weight: 590; line-height: 1.35; }
    .scheduled-task-copy small { margin-top: 4px; color: var(--faint); font-size: 9.8px; line-height: 1.35; }
    .avatar { display: grid; width: 26px; height: 26px; flex: 0 0 26px; place-items: center; border-radius: 50%; color: #fff; font-size: 9.5px; font-weight: 700; line-height: 1; }
    .member-alice { background: var(--identity-1); }
    .member-minato { background: var(--identity-2); }
    .member-gugu { background: var(--identity-3); }

    .task-suggestions { margin: 18px 5px 0; padding-top: 13px; border-top: 1px solid var(--line); }
    .task-suggestions h2 { margin: 0 0 7px 3px; color: var(--faint); font-size: 10px; font-weight: 560; }
    .suggestion-list { display: grid; gap: 1px; }
    .suggestion-row {
      display: grid;
      width: 100%;
      min-width: 0;
      min-height: 34px;
      grid-template-columns: 16px minmax(0, 1fr);
      align-items: center;
      gap: 7px;
      padding: 4px 6px;
      border: 0;
      border-radius: 6px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .suggestion-row:hover { background: var(--surface-hover); }
    .suggestion-icon { display: grid; width: 16px; height: 16px; place-items: center; color: var(--brand); }
    .suggestion-icon svg { width: 13px; height: 13px; }
    .suggestion-copy { display: flex; min-width: 0; align-items: baseline; gap: 6px; }
    .suggestion-copy strong { min-width: 0; overflow: hidden; font-size: 10px; font-weight: 560; text-overflow: ellipsis; white-space: nowrap; }
    .suggestion-copy small { flex: 0 0 auto; color: var(--faint); font-size: 8.8px; white-space: nowrap; }

    .editor-pane { min-width: 0; min-height: 0; overflow-y: auto; background: var(--conversation-surface); }
    .editor-inner { display: flex; width: min(980px, calc(100% - 40px)); min-height: calc(100% - 38px); flex-direction: column; margin: 0 20px; padding: 10px 0 18px; }
    .editor-topline { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 12px; }
    .task-name-input {
      width: 100%;
      min-width: 0;
      margin: 0;
      padding: 0 0 3px;
      border: 0;
      border-radius: 4px;
      color: var(--ink);
      background: transparent;
      font-size: 16px;
      font-weight: 590;
      line-height: 1.3;
      letter-spacing: -.018em;
    }
    .task-name-input::placeholder { color: color-mix(in srgb, var(--faint) 76%, transparent); }
    .task-name-input:focus,
    .task-name-input:focus-visible { outline: 0; outline-offset: 0; box-shadow: inset 0 -2px 0 var(--brand); }
    .editor-utilities { display: flex; align-items: center; gap: 4px; margin-top: -3px; }
    .editor-close {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 6px;
      color: var(--faint);
      background: transparent;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }
    .editor-close:hover { color: var(--ink); background: var(--surface-muted); }

    .template-picker { position: relative; }
    .template-trigger {
      display: inline-flex;
      min-height: 28px;
      align-items: center;
      gap: 5px;
      padding: 4px 7px;
      border: 0;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 10px;
    }
    .template-trigger:hover { color: var(--ink); background: var(--surface-muted); }
    .template-menu {
      position: absolute;
      z-index: 30;
      top: calc(100% + 5px);
      right: 0;
      display: none;
      width: 226px;
      padding: 5px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: var(--surface-raised);
      box-shadow: var(--shadow-float);
    }
    .template-menu.open { display: grid; }
    .template-option {
      display: grid;
      width: 100%;
      min-height: 44px;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border: 0;
      border-radius: 6px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .template-option:hover { background: var(--surface-hover); }
    .template-option strong { display: block; font-size: 10.5px; font-weight: 620; }
    .template-option small { display: block; margin-top: 2px; color: var(--faint); font-size: 8.8px; }
    .template-option > span:last-child { color: var(--faint); font: 9px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }

    .task-prompt-input {
      width: 100%;
      min-height: 72px;
      margin-top: 12px;
      padding: 11px 12px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: var(--input);
      font-size: 11.5px;
      line-height: 1.62;
    }
    .task-prompt-input::placeholder { color: var(--faint); }
    .task-prompt-input:focus { border-color: var(--control-line); box-shadow: 0 0 0 3px var(--focus-soft); outline: 0; }

    .context-panel {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-raised);
    }
    .context-field {
      display: grid;
      min-width: 0;
      min-height: 43px;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      padding: 0 13px;
    }
    .context-field + .context-field { border-left: 1px solid var(--line); }
    .context-field > span { color: var(--muted); font-size: 10px; white-space: nowrap; }
    .context-field select {
      width: 100%;
      min-width: 0;
      min-height: 30px;
      padding: 4px 24px 4px 6px;
      border: 0;
      border-radius: 6px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      font-size: 10.5px;
      text-align: right;
      text-align-last: right;
    }
    .context-field select:hover { background: var(--surface-muted); }

    .schedule-section { margin-top: 18px; }
    .field-caption { margin: 0 0 6px; color: var(--faint); font-size: 10px; font-weight: 500; }
    .schedule-panel { position: relative; overflow: visible; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-raised); }
    .schedule-row { display: grid; min-height: 42px; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 18px; padding: 0 14px; }
    .schedule-row + .schedule-row { border-top: 1px solid var(--line); }
    .schedule-row > span:first-child { color: var(--ink); font-size: 10.5px; }
    .schedule-control {
      position: relative;
      display: inline-flex;
      min-height: 30px;
      align-items: center;
      gap: 5px;
      padding: 4px 2px 4px 8px;
      border: 0;
      border-radius: 6px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      font-size: 10.5px;
      text-align: right;
    }
    .schedule-control:hover { background: var(--surface-muted); }
    .schedule-control svg { width: 12px; height: 12px; color: var(--faint); }
    .schedule-input {
      width: 172px;
      min-height: 30px;
      padding: 4px 7px;
      border: 0;
      border-radius: 6px;
      color: var(--ink);
      background: var(--surface-subtle);
      font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: right;
    }
    .schedule-input:focus { box-shadow: 0 0 0 2px var(--focus-soft); outline: 0; }
    .schedule-menu {
      position: absolute;
      z-index: 35;
      top: 38px;
      right: 8px;
      display: none;
      width: 150px;
      padding: 5px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: var(--surface-raised);
      box-shadow: var(--shadow-float);
    }
    .schedule-menu.open { display: grid; }
    .schedule-menu button { display: flex; min-height: 32px; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 8px; border: 0; border-radius: 6px; color: var(--ink); background: transparent; cursor: pointer; font-size: 10.5px; text-align: left; }
    .schedule-menu button:hover { background: var(--surface-hover); }
    .schedule-menu button.selected { color: var(--brand-ink); background: var(--surface-selected); }
    .schedule-check { width: 14px; color: var(--brand-ink); text-align: center; }

    .channel-disclosure { margin-top: 7px; color: var(--muted); }
    .channel-disclosure summary { display: inline-flex; min-height: 26px; align-items: center; gap: 5px; padding: 2px 3px; border-radius: 5px; cursor: pointer; font-size: 9.8px; list-style: none; }
    .channel-disclosure summary::-webkit-details-marker { display: none; }
    .channel-disclosure summary:hover { color: var(--ink); background: var(--surface-subtle); }
    .channel-disclosure summary svg { width: 11px; height: 11px; color: var(--faint); transition: transform 120ms ease; }
    .channel-disclosure[open] summary svg { transform: rotate(90deg); }
    .channel-selected-count { color: var(--faint); }
    .channel-options { display: flex; flex-wrap: wrap; gap: 7px 18px; padding: 4px 3px 0; }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
    }
    function escapeAttribute(value) { return escapeHtml(value); }

    function memberConfigLabel(member) {
      return `${member.runtime} · ${member.model}`;
    }

    function avatarHtml(memberId) {
      const member = members[memberId] || members.alice;
      return `<span class="avatar ${member.avatarClass}" title="${escapeAttribute(member.name)} · ${escapeAttribute(memberConfigLabel(member))}">${member.initial}</span>`;
    }

    function weekdayShort(value) { return String(value || '').replace('星期', ''); }

    function formatTime(value) {
      const [hourRaw, minute = '00'] = String(value || '09:00').split(':');
      const hour = Number(hourRaw);
      const suffix = hour >= 12 ? 'PM' : 'AM';
      const displayHour = hour % 12 || 12;
      return `${String(displayHour).padStart(2, '0')}:${minute} ${suffix}`;
    }

    function scheduleText(task) {
      if (task.frequency === 'daily') return `每天 ${formatTime(task.time || '09:00')}`;
      if (task.frequency === 'workdays') return `工作日 ${formatTime(task.time || '09:00')}`;
      if (task.frequency === 'weekly') return `每周${weekdayShort(task.weekday || '星期五')} ${formatTime(task.time || '17:30')}`;
      if (task.frequency === 'custom') return task.cron ? `自定义 · ${task.cron}` : '自定义';
      if (task.frequency === 'once') return `${task.date || '2026-09-05'} ${formatTime(task.time || '09:00')}`;
      return '手动触发';
    }

    function selectedTask() {
      return tasks.find((item) => item.id === selectedTaskId) || null;
    }

    function taskListWidthBounds() {
      const shellWidth = Math.max(0, els.shell.getBoundingClientRect().width || 1136);
      const splitterWidth = 7;
      const fullWidth = Math.max(208, Math.floor(shellWidth - splitterWidth));
      // Let the editor shrink to a compact, still-usable column before the
      // final drag gesture closes it completely.
      const minimumEditorWidth = 320;
      const normalMaximum = Math.max(208, fullWidth - minimumEditorWidth);
      return {
        fullWidth,
        normalMaximum,
        closeThreshold: Math.min(fullWidth, normalMaximum + 32)
      };
    }

    function clampTaskListWidth(value) {
      const bounds = taskListWidthBounds();
      const numeric = Number(value) || TASK_LIST_DEFAULT_WIDTH;
      if (numeric >= bounds.closeThreshold) return bounds.fullWidth;
      return Math.round(Math.min(bounds.normalMaximum, Math.max(208, numeric)));
    }

    function setTaskListWidth(value) {
      const bounds = taskListWidthBounds();
      const width = clampTaskListWidth(value);
      const editorClosed = width >= bounds.fullWidth;
      els.shell.classList.toggle('editor-closed', editorClosed);
      if (!editorClosed) lastOpenTaskListWidth = width;
      els.shell.style.setProperty('--task-list-width', `${width}px`);
      els.splitter.setAttribute('aria-valuemax', String(bounds.fullWidth));
      els.splitter.setAttribute('aria-valuenow', String(width));
      els.splitter.setAttribute('aria-valuetext', editorClosed ? '创建或详情页已关闭' : `任务列表宽度 ${width} 像素`);
      const tip = els.splitter.querySelector('.task-splitter-tip');
      if (tip) tip.textContent = editorClosed ? '向左拖动打开任务页' : '拖到最右侧关闭任务页';
      return width;
    }

    function ensureEditorOpen() {
      if (!els.shell.classList.contains('editor-closed')) return;
      const bounds = taskListWidthBounds();
      setTaskListWidth(Math.min(lastOpenTaskListWidth || TASK_LIST_DEFAULT_WIDTH, bounds.normalMaximum));
    }

    function setWorkspaceMode(mode) {
      els.shell.classList.toggle('overview', mode === 'overview');
    }

    function setTaskCreateChooserOpen(open) {
      const nextOpen = Boolean(open) && editorMode === 'detail';
      els.taskCreateChooser.hidden = !nextOpen;

    }

    function updateTaskPageCreateVisibility() {
      const visible = editorMode !== 'overview';
      els.taskPageCreate.hidden = !visible;
      if (!visible) setTaskCreateChooserOpen(false);
    }

    function showOverview() {
      flushAutosave();
      editorMode = 'overview';
      updateTaskPageCreateVisibility();
      selectedTaskId = null;
      openTaskMenuId = null;
      setWorkspaceMode('overview');
      closeMenus(false);
      renderTaskList();
    }

    function updateMemberAvatar() {
      const member = members[els.member.value] || members.alice;
      const configLabel = memberConfigLabel(member);
      els.memberAvatar.className = `avatar compact-member-avatar ${member.avatarClass}`;
      els.memberAvatar.textContent = member.initial;
      els.memberAvatar.title = `${member.name} · ${configLabel}`;
      els.memberName.textContent = member.name;
      els.memberRole.textContent = member.role;
      els.memberRuntime.textContent = member.runtime;
      els.memberTrigger.dataset.memberConfig = configLabel;
      els.memberTrigger.setAttribute('aria-label', `执行队员：${member.name}，${member.role}。当前配置：${configLabel}`);
      els.memberMenu.querySelectorAll('[data-member-option]').forEach((option) => {
        const optionMember = members[option.dataset.memberOption] || members.alice;
        const selected = option.dataset.memberOption === els.member.value;
        option.dataset.memberConfig = memberConfigLabel(optionMember);
        option.setAttribute('aria-label', `${optionMember.name}，${optionMember.role}。当前配置：${memberConfigLabel(optionMember)}`);
        option.setAttribute('aria-selected', selected ? 'true' : 'false');
        option.querySelector('.member-picker-check').textContent = '';
      });
    }

    function setMemberMenuOpen(open) {
      els.memberMenu.classList.toggle('open', open);
      els.memberTrigger.setAttribute('aria-expanded', open ? 'true' : 'false');

    function projectIconMarkup(kind) {
      return kind === 'quick'

    }

    function updateProjectPicker() {

        close: '<path d="M8 1.8v5.1"></path><path d="M4.6 3.85a5.55 5.55 0 1 0 6.8 0"></path>',
        open: '<path d="M8 1.8v5.1"></path><path d="M4.6 3.85a5.55 5.55 0 1 0 6.8 0"></path>',
        delete: '<path d="M3.1 4.3h9.8"></path><path d="M6.2 2.2h3.6l.6 2.1H5.6Z"></path><path d="m4.5 4.3.55 9.1h5.9l.55-9.1"></path><path d="M6.8 6.8v4.2M9.2 6.8v4.2"></path>'
      };
      return `<span class="task-action-icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">${paths[action] || ''}</svg></span>`;
    }

    function taskStateIcon(task) {
      if (task.completed) {
        return '<span class="task-state-icon state-completed" title="已完成" aria-label="已完成"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.5"></circle><path d="m5.4 8.1 1.6 1.7 3.7-3.8"></path></svg></span>';
      }
      if (task.paused) {
        return '<span class="task-state-icon state-closed" title="已关闭" aria-label="已关闭"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.5"></circle><path d="M6.4 5.7v4.6M9.6 5.7v4.6"></path></svg></span>';
      }
      return '<span class="task-state-icon state-active" title="已开启" aria-label="已开启"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.5"></circle><path d="M8 4.8v3.4l2.35 1.35"></path></svg></span>';
    }

    function renderFilterTabs() {
      document.querySelectorAll('[data-task-filter]').forEach((button) => {
        const active = button.dataset.taskFilter === activeFilter;
        button.classList.toggle('active', active);
        button.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      if (els.filter) els.filter.value = activeFilter;
    }

    function renderTaskList() {
      const query = els.search.value.trim().toLowerCase();
      const visibleTasks = tasks.filter((task) => {
        const displayName = task.name || '未命名定时任务';
        const matchesQuery = !query || displayName.toLowerCase().includes(query) || scheduleText(task).toLowerCase().includes(query);
        const matchesFilter = activeFilter === 'all'
          || (activeFilter === 'active' && !task.paused && !task.completed)
          || (activeFilter === 'paused' && (task.paused || task.completed));
        return matchesQuery && matchesFilter;
      });

      const overviewWithoutTasks = editorMode === 'overview' && tasks.length === 0;
      els.shell.classList.toggle('no-tasks', overviewWithoutTasks);
      if (els.taskControls) els.taskControls.hidden = overviewWithoutTasks;
      if (els.taskListScroll) els.taskListScroll.hidden = overviewWithoutTasks;
      renderFilterTabs();

      els.list.innerHTML = visibleTasks.length ? visibleTasks.map((task) => {
        const active = task.id === selectedTaskId;
        const incomplete = !task.name.trim() || !task.prompt.trim();
        return `
          <div class="scheduled-task-item ${active ? 'active' : ''}" data-task-item="${task.id}">
            <button class="scheduled-task-open" type="button" data-task-id="${task.id}" aria-current="${active ? 'true' : 'false'}">
              ${taskStateIcon(task)}
              <span class="scheduled-task-copy"><strong>${escapeHtml(task.name || '未命名定时任务')}</strong><small>${escapeHtml(scheduleText(task))}</small></span>
              ${avatarHtml(task.member)}
            </button>
            <button class="scheduled-task-more" type="button" data-task-more="${task.id}" aria-label="${escapeAttribute(task.name || '未命名定时任务')}的操作" aria-haspopup="menu" aria-expanded="${openTaskMenuId === task.id ? 'true' : 'false'}">⋯</button>
            <div class="task-action-menu ${openTaskMenuId === task.id ? 'open' : ''}" role="menu" data-task-menu="${task.id}">
              <button type="button" role="menuitem" data-task-action="run" data-task-action-id="${task.id}" ${incomplete ? 'disabled title="请先填写名称和执行内容"' : ''}>${taskActionIcon('run')}<span>运行一次</span></button>
              <button type="button" role="menuitem" data-task-action="close" data-task-action-id="${task.id}">${taskActionIcon(task.paused ? 'open' : 'close')}<span>${task.paused ? '开启' : '关闭'}</span></button>
              <button class="danger" type="button" role="menuitem" data-task-action="delete" data-task-action-id="${task.id}">${taskActionIcon('delete')}<span>删除</span></button>
            </div>
          </div>`;
      }).join('') : (tasks.length ? '<div style="padding:16px 9px;color:var(--faint);font-size:9.8px;">没有匹配的定时任务</div>' : '');

      els.list.querySelectorAll('[data-task-id]').forEach((button) => button.addEventListener('click', () => openDetail(button.dataset.taskId)));
      els.list.querySelectorAll('[data-task-more]').forEach((button) => button.addEventListener('click', (event) => {
        event.stopPropagation();
        const taskId = button.dataset.taskMore;
        openTaskMenuId = openTaskMenuId === taskId ? null : taskId;
        renderTaskList();
      }));
      els.list.querySelectorAll('[data-task-action]').forEach((button) => button.addEventListener('click', (event) => {
        event.stopPropagation();
        handleTaskAction(button.dataset.taskAction, button.dataset.taskActionId);
      }));
    }

    function openDetail(taskId) {
      flushAutosave();
      const task = tasks.find((item) => item.id === taskId);
      if (!task) return;
      editorMode = 'detail';
      els.editorKindLabel.textContent = '详情';
      updateTaskPageCreateVisibility();
      setTaskCreateChooserOpen(false);
      setWorkspaceMode('split');
      ensureEditorOpen();
      selectedTaskId = task.id;
      currentFrequency = task.frequency;
      openTaskMenuId = null;
      suppressAutosave = true;
      els.name.value = task.name;
      els.prompt.value = task.prompt;
      els.member.value = task.member;
      els.project.value = task.project;
      updateProjectPicker();
      els.feishu.checked = task.channels.includes('feishu');
      els.dingtalk.checked = task.channels.includes('dingtalk');
      els.channelDisclosure.open = false;
      updateMemberChannels(false);
      renderSchedule(task);
      renderHistory(task.history || []);
      els.historySection.hidden = !(task.history && task.history.length);
      els.createActions.hidden = true;
      suppressAutosave = false;
      closeMenus(false);
      renderTaskList();
    }

    function beginCreate(templateKey = null) {
      flushAutosave();
      const template = templateKey ? templates[templateKey] : null;
      editorMode = 'create';
      els.editorKindLabel.textContent = '新建';
      updateTaskPageCreateVisibility();
      setTaskCreateChooserOpen(false);
      setWorkspaceMode('split');
      ensureEditorOpen();
      selectedTaskId = null;
      openTaskMenuId = null;
      suppressAutosave = true;
      els.name.value = template?.name || '';
      els.prompt.value = template?.prompt || '';
      els.project.value = '快速对话';
      updateProjectPicker();
      els.member.value = 'alice';
      els.feishu.checked = false;
      els.dingtalk.checked = false;
      els.channelDisclosure.open = false;
      currentFrequency = template?.frequency || 'daily';
      updateMemberChannels(false);
      renderSchedule({
        frequency: currentFrequency,
        time: template?.time || '09:00',
        weekday: template?.weekday,
        cron: template?.cron,
        date: template?.date
      });
      els.historySection.hidden = true;
      els.createActions.hidden = false;
      suppressAutosave = false;
      updateCreateButtonState();
      closeMenus(false);
      renderTaskList();
      requestAnimationFrame(() => els.editorPane.focus({ preventScroll: true }));
    }

    function updateCreateButtonState() {
      if (editorMode !== 'create') {
        els.createSubmit.disabled = true;
        return;
      }
      els.createSubmit.disabled = !els.prompt.value.trim();
    }

    function createCurrentTask() {
      if (editorMode !== 'create') return;
      const draft = collectDraft();
      if (!draft.name) draft.name = draft.prompt.slice(0, 30);
      if (!draft.prompt) {
        els.prompt.focus();
        return;
      }
      const task = {
        id: `task-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
        ...draft,
        paused: false,
        completed: false,
        history: []
      };
      tasks.unshift(task);
      editorMode = 'detail';
      openDetail(task.id);
      showToast('定时任务已创建');
    }

    function updateMemberChannels(resetUnavailable = true) {
      const member = members[els.member.value] || members.alice;
      updateMemberAvatar();
      els.feishu.disabled = !member.feishu;
      els.dingtalk.disabled = !member.dingtalk;
      els.feishuOption.classList.toggle('disabled', !member.feishu);
      els.dingtalkOption.classList.toggle('disabled', !member.dingtalk);
      els.feishuOption.title = member.feishu ? `通过${member.name}的飞书 Bot 发送结果` : `${member.name}尚未开通飞书 Bot`;
      els.dingtalkOption.title = member.dingtalk ? `通过${member.name}的钉钉 Bot 发送结果` : `${member.name}尚未开通钉钉 Bot`;
      els.feishuMeta.textContent = member.feishu ? `${member.name} Bot` : '未开通';
      els.dingtalkMeta.textContent = member.dingtalk ? `${member.name} Bot` : '未开通';
      if (resetUnavailable) {
        if (!member.feishu) els.feishu.checked = false;
        if (!member.dingtalk) els.dingtalk.checked = false;
      }
      updateChannelCount();
    }

    function formatDateLabel(value) {
      const [year, month, day] = String(value || '2026-09-05').split('-').map(Number);
      return `${year}年${month}月${day}日`;
    }

    function clampNumber(value, min, max, fallback) {
      const parsed = Number.parseInt(String(value), 10);
      if (!Number.isFinite(parsed)) return fallback;
      return Math.min(max, Math.max(min, parsed));
    }

    function normalizeTime(hourValue, minuteValue) {
      const hour = clampNumber(hourValue, 0, 23, 9);
      const minute = clampNumber(minuteValue, 0, 59, 0);
      return `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
    }

    function timePickerMarkup(value) {
      const normalized = /^\d{2}:\d{2}$/.test(value || '') ? value : '09:00';
      const [hour, minute] = normalized.split(':');
      const presets = ['08:00', '09:00', '12:00', '17:30'];
      return `
        <div class="schedule-row">
          <span>时间</span>
          <div class="schedule-picker">
            <input id="scheduleTime" type="hidden" value="${escapeAttribute(normalized)}" />
            <button class="schedule-value-button" type="button" data-open-schedule-picker="time" aria-haspopup="dialog" aria-expanded="false">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5.5"></circle><path d="M8 4.8v3.4l2.2 1.3"></path></svg>
              <span id="scheduleTimeLabel">${escapeHtml(normalized)}</span>
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 4.5 3 3 3-3"></path></svg>
            </button>
            <div class="schedule-popover time-picker-popover" data-schedule-picker="time" role="dialog" aria-label="选择运行时间">
              <div class="picker-heading"><span>选择时间</span><strong id="timePickerCurrent">${escapeHtml(normalized)}</strong></div>
              <div class="time-editor">
                <div class="time-stepper">
                  <button type="button" data-time-step-unit="hour" data-time-step-value="1" aria-label="小时加一"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="m3 7.5 3-3 3 3"></path></svg></button>
                  <input id="timeHourInput" inputmode="numeric" maxlength="2" value="${hour}" aria-label="小时" />
                  <button type="button" data-time-step-unit="hour" data-time-step-value="-1" aria-label="小时减一"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="m3 4.5 3 3 3-3"></path></svg></button>
                </div>
                <span class="time-colon">:</span>
                <div class="time-stepper">
                  <button type="button" data-time-step-unit="minute" data-time-step-value="5" aria-label="分钟加五"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="m3 7.5 3-3 3 3"></path></svg></button>
                  <input id="timeMinuteInput" inputmode="numeric" maxlength="2" value="${minute}" aria-label="分钟" />
                  <button type="button" data-time-step-unit="minute" data-time-step-value="-5" aria-label="分钟减五"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="m3 4.5 3 3 3-3"></path></svg></button>
                </div>
              </div>
              <div class="time-presets">
                ${presets.map((preset) => `<button type="button" data-time-preset="${preset}" class="${preset === normalized ? 'selected' : ''}">${preset}</button>`).join('')}
              </div>
            </div>
          </div>
        </div>`;
    }

    function datePickerMarkup(value) {
      const normalized = /^\d{4}-\d{2}-\d{2}$/.test(value || '') ? value : '2026-09-05';
      return `
        <div class="schedule-row">
          <span>日期</span>
          <div class="schedule-picker">
            <input id="scheduleDate" type="hidden" value="${escapeAttribute(normalized)}" />
            <button class="schedule-value-button" type="button" data-open-schedule-picker="date" aria-haspopup="dialog" aria-expanded="false">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.7" y="3.4" width="10.6" height="9.4" rx="1.7"></rect><path d="M5 2v2.8M11 2v2.8M2.7 6.2h10.6"></path></svg>
              <span id="scheduleDateLabel">${escapeHtml(formatDateLabel(normalized))}</span>
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 4.5 3 3 3-3"></path></svg>
            </button>
            <div class="schedule-popover date-picker-popover" data-schedule-picker="date" role="dialog" aria-label="选择运行日期">
              <div class="calendar-heading">
                <button type="button" data-calendar-nav="-1" aria-label="上个月"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="m7.5 3-3 3 3 3"></path></svg></button>
                <strong id="calendarMonthLabel"></strong>
                <button type="button" data-calendar-nav="1" aria-label="下个月"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="m4.5 3 3 3-3 3"></path></svg></button>
              </div>
              <div class="calendar-weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
              <div class="calendar-grid" id="calendarGrid"></div>
            </div>
          </div>
        </div>`;
    }

    function weekdayPickerMarkup(value) {
      const weekdays = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];
      const normalized = weekdays.includes(value) ? value : '星期五';
      return `
        <div class="schedule-row">
          <span>每</span>
          <div class="schedule-picker">
            <input id="scheduleWeekday" type="hidden" value="${escapeAttribute(normalized)}" />
            <button class="schedule-value-button" type="button" data-open-schedule-picker="weekday" aria-haspopup="listbox" aria-expanded="false">
              <span id="scheduleWeekdayLabel">${escapeHtml(normalized)}</span>
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 4.5 3 3 3-3"></path></svg>
            </button>
            <div class="schedule-popover weekday-picker-popover" data-schedule-picker="weekday" role="listbox" aria-label="选择星期">
              ${weekdays.map((weekday) => `<button type="button" data-weekday-value="${weekday}" class="${weekday === normalized ? 'selected' : ''}" role="option" aria-selected="${weekday === normalized ? 'true' : 'false'}"><span>${weekday}</span><span>${weekday === normalized ? '✓' : ''}</span></button>`).join('')}
            </div>
          </div>
        </div>`;
    }

    function closeSchedulePickers() {
      openSchedulePicker = null;
      els.scheduleRows.querySelectorAll('[data-schedule-picker]').forEach((popover) => popover.classList.remove('open'));
      els.scheduleRows.querySelectorAll('[data-open-schedule-picker]').forEach((trigger) => trigger.setAttribute('aria-expanded', 'false'));
    }

    function renderCalendarPicker() {
      const dateInput = document.getElementById('scheduleDate');
      const grid = document.getElementById('calendarGrid');
      const label = document.getElementById('calendarMonthLabel');
      if (!dateInput || !grid || !label) return;
      const selectedParts = dateInput.value.split('-').map(Number);
      if (!calendarCursor) calendarCursor = new Date(selectedParts[0], selectedParts[1] - 1, 1);
      const year = calendarCursor.getFullYear();
      const month = calendarCursor.getMonth();
      label.textContent = `${year} 年 ${month + 1} 月`;
      const firstDay = new Date(year, month, 1);
      const mondayIndex = (firstDay.getDay() + 6) % 7;
      const start = new Date(year, month, 1 - mondayIndex);
      const today = new Date();
      const selected = dateInput.value;
      grid.innerHTML = Array.from({ length: 42 }, (_, index) => {
        const day = new Date(start);
        day.setDate(start.getDate() + index);
        const value = `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, '0')}-${String(day.getDate()).padStart(2, '0')}`;
        const outside = day.getMonth() !== month;
        const isSelected = value === selected;
        const isToday = day.getFullYear() === today.getFullYear() && day.getMonth() === today.getMonth() && day.getDate() === today.getDate();
        return `<button class="calendar-day ${outside ? 'outside' : ''} ${isSelected ? 'selected' : ''} ${isToday ? 'today' : ''}" type="button" data-calendar-date="${value}" aria-label="${day.getFullYear()}年${day.getMonth() + 1}月${day.getDate()}日">${day.getDate()}</button>`;
      }).join('');
    }

    function updateTimeValue(hourValue, minuteValue, closeAfter = false) {
      const hidden = document.getElementById('scheduleTime');
      if (!hidden) return;
      const normalized = normalizeTime(hourValue, minuteValue);
      hidden.value = normalized;
      const label = document.getElementById('scheduleTimeLabel');
      const current = document.getElementById('timePickerCurrent');
      const hourInput = document.getElementById('timeHourInput');
      const minuteInput = document.getElementById('timeMinuteInput');
      if (label) label.textContent = normalized;
      if (current) current.textContent = normalized;
      if (hourInput) hourInput.value = normalized.slice(0, 2);
      if (minuteInput) minuteInput.value = normalized.slice(3, 5);
      els.scheduleRows.querySelectorAll('[data-time-preset]').forEach((button) => button.classList.toggle('selected', button.dataset.timePreset === normalized));
      autosaveCurrentTask();
      if (closeAfter) closeSchedulePickers();
    }

    function wireScheduleControls() {
      closeSchedulePickers();
      const dateInput = document.getElementById('scheduleDate');
      if (dateInput) {
        const [year, month] = dateInput.value.split('-').map(Number);
        calendarCursor = new Date(year, month - 1, 1);
        renderCalendarPicker();
      } else {
        calendarCursor = null;
      }
    }

    function renderSchedule(source) {
      currentFrequency = source.frequency || currentFrequency;
      els.frequencyLabel.textContent = frequencyNames[currentFrequency];
      els.frequencyMenu.querySelectorAll('[data-frequency]').forEach((button) => {
        const selected = button.dataset.frequency === currentFrequency;
        button.classList.toggle('selected', selected);
        button.querySelector('.schedule-check').textContent = selected ? '✓' : '';
      });

      let rows = '';
      if (currentFrequency === 'daily' || currentFrequency === 'workdays') {
        rows = timePickerMarkup(source.time || '09:00');
      } else if (currentFrequency === 'weekly') {
        rows = weekdayPickerMarkup(source.weekday || '星期五') + timePickerMarkup(source.time || '17:30');
      } else if (currentFrequency === 'custom') {
        rows = `<div class="schedule-row"><span>Cron</span><input class="schedule-cron-input" id="scheduleCron" value="${escapeAttribute(source.cron || '0 9 * * *')}" aria-label="Cron 表达式" spellcheck="false" /></div>`;
      } else if (currentFrequency === 'once') {
        rows = datePickerMarkup(source.date || '2026-09-05') + timePickerMarkup(source.time || '09:00');
      }
      els.scheduleRows.innerHTML = rows;
      wireScheduleControls();
    }

    function collectDraft() {
      const channels = [];
      if (els.feishu.checked && !els.feishu.disabled) channels.push('feishu');
      if (els.dingtalk.checked && !els.dingtalk.disabled) channels.push('dingtalk');
      const draft = {
        name: els.name.value.trim(),
        prompt: els.prompt.value.trim(),
        project: els.project.value,
        member: els.member.value,
        frequency: currentFrequency,
        channels
      };
      const time = document.getElementById('scheduleTime');
      const weekday = document.getElementById('scheduleWeekday');
      const cron = document.getElementById('scheduleCron');
      const date = document.getElementById('scheduleDate');
      if (time) draft.time = time.value;
      if (weekday) draft.weekday = weekday.value;
      if (cron) draft.cron = cron.value.trim();
      if (date) draft.date = date.value;
      return draft;
    }

    function autosaveCurrentTask() {
      if (suppressAutosave) return;
      if (editorMode === 'create') {
        updateCreateButtonState();
        return;
      }
      clearTimeout(autosaveTimer);
      autosaveTimer = setTimeout(() => {
        const task = selectedTask();
        if (!task) return;
        Object.assign(task, collectDraft());
        task.draft = !task.name.trim() || !task.prompt.trim();
        renderTaskList();
      }, 220);
    }

    function flushAutosave() {
      clearTimeout(autosaveTimer);
      autosaveTimer = null;
      if (suppressAutosave || editorMode === 'create') return;
      const task = selectedTask();
      if (!task) return;
      Object.assign(task, collectDraft());
      task.draft = !task.name.trim() || !task.prompt.trim();
    }

    function runStateIconMarkup(status) {
      const icons = {
        running: '<span class="run-state-icon state-running" role="img" aria-label="进行中" title="进行中"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.2" opacity=".28"></circle><path d="M8 2.8A5.2 5.2 0 0 1 13.2 8"></path><circle cx="8" cy="8" r="1.15" fill="currentColor" stroke="none"></circle></svg></span>',
        success: '<span class="run-state-icon state-completed" role="img" aria-label="已完成" title="已完成"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.2"></circle><path d="m5.35 8.05 1.7 1.75 3.7-3.75"></path></svg></span>',
        failed: '<span class="run-state-icon state-failed" role="img" aria-label="已失败" title="已失败"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.4 13.6 8 8 13.6 2.4 8Z"></path><path d="m6.15 6.15 3.7 3.7m0-3.7-3.7 3.7"></path></svg></span>',
        skipped: '<span class="run-state-icon state-stopped" role="img" aria-label="已跳过" title="已跳过"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.2"></circle><path d="M5.25 8h5.5"></path></svg></span>'
      };
      return icons[status] || icons.success;
    }

    function renderHistory(history) {
      if (!history.length) {
        els.historyList.innerHTML = '<div class="history-empty">还没有执行记录</div>';
        return;
      }
      const statusPresentation = {
        success: { label: '已完成' },
        failed: { label: '已失败' },
        running: { label: '进行中' },
        skipped: { label: '已跳过' }
      };
      els.historyList.innerHTML = history.map((item, index) => {
        const status = statusPresentation[item.status] || statusPresentation.success;
        return `
          <button class="history-row" type="button" data-history-index="${index}" data-history-status="${escapeAttribute(item.status)}" aria-label="${escapeAttribute(status.label)}，${escapeAttribute(item.when)}${item.status === 'skipped' ? '' : '，点击打开执行对话'}">
            ${runStateIconMarkup(item.status)}
            <span class="run-when">${escapeHtml(item.when)}</span>
            <span class="run-relative">${escapeHtml(item.relative || '')}</span>
          </button>`;
      }).join('');
      els.historyList.querySelectorAll('[data-history-index]').forEach((button) => {
        button.addEventListener('click', () => {
          if (button.dataset.historyStatus === 'skipped') {
            showToast('本次已跳过，没有创建对话');
            return;
          }
          showToast('已打开这次运行创建的对话');
        });
      });
    }

    function handleTaskAction(action, taskId) {
      const task = tasks.find((item) => item.id === taskId);
      if (!task) return;
      openTaskMenuId = null;
      if (action === 'run') {
        showToast(`已运行一次“${task.name || '未命名定时任务'}”，并创建新对话`);
      } else if (action === 'close') {
        task.paused = !task.paused;
        showToast(task.paused ? '定时任务已关闭' : '定时任务已开启');
      } else if (action === 'delete') {
        const index = tasks.findIndex((item) => item.id === taskId);
        tasks.splice(index, 1);
        if (selectedTaskId === taskId) {
          const next = tasks[Math.max(0, Math.min(index, tasks.length - 1))] || null;
          if (next) openDetail(next.id);
          else clearEditor();
        }
        showToast('定时任务已删除');
      }
      renderTaskList();
    }

    function clearEditor() {
      showOverview();
    }

    function updateChannelCount() {
      const selected = [];
      if (els.feishu.checked && !els.feishu.disabled) selected.push('飞书');
      if (els.dingtalk.checked && !els.dingtalk.disabled) selected.push('钉钉');
      els.channelCount.textContent = selected.length ? selected.join('、') : '未选择';
    }

    function closeMenus(render = true) {
      els.frequencyMenu.classList.remove('open');
      els.frequencyTrigger.setAttribute('aria-expanded', 'false');
      setMemberMenuOpen(false);
      setProjectMenuOpen(false);
      closeSchedulePickers();
      if (openTaskMenuId !== null) {
        openTaskMenuId = null;
        if (render) renderTaskList();
      }
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      els.toast.textContent = message;
      els.toast.classList.add('show');
      toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2200);
    }

    document.querySelectorAll('[data-project-toggle]').forEach((button) => button.addEventListener('click', () => button.closest('[data-project-group]').classList.toggle('collapsed')));
    document.querySelectorAll('[data-conversation]').forEach((button) => button.addEventListener('click', () => showToast(`打开“${button.dataset.conversation}”`)));
    document.querySelectorAll('[data-nav-label]').forEach((button) => button.addEventListener('click', () => showToast(`${button.dataset.navLabel}页面不在本交互稿范围内`)));
    document.querySelector('.conversation-jump').addEventListener('click', () => showToast('打开对话跳转面板'));
    document.querySelector('.section-create-button').addEventListener('click', () => showToast('选择工作目录'));
    els.scheduledNav.addEventListener('click', showOverview);

    document.querySelectorAll('[data-task-filter]').forEach((button) => {
      button.addEventListener('click', () => {
        activeFilter = button.dataset.taskFilter;
        renderTaskList();
      });
    });
    els.search.addEventListener('input', renderTaskList);
    document.querySelectorAll('[data-suggestion-template]').forEach((button) => {
      button.addEventListener('click', () => beginCreate(button.dataset.suggestionTemplate));
    });
    document.getElementById('closeEditorButton').addEventListener('click', showOverview);
    els.overviewCreate.addEventListener('click', () => beginCreate());
    els.taskPageCreate.addEventListener('click', (event) => {
      event.stopPropagation();
      beginCreate();
    });
    els.taskCreateBlank.addEventListener('click', () => beginCreate());
    els.createSubmit.addEventListener('click', createCurrentTask);

    [els.name, els.prompt].forEach((control) => control.addEventListener('input', autosaveCurrentTask));
    els.memberTrigger.addEventListener('click', (event) => {
      event.stopPropagation();
      const open = !els.memberMenu.classList.contains('open');
      closeSchedulePickers();
      setProjectMenuOpen(false);
      els.frequencyMenu.classList.remove('open');
      els.frequencyTrigger.setAttribute('aria-expanded', 'false');
      setMemberMenuOpen(open);
    });
    els.memberMenu.querySelectorAll('[data-member-option]').forEach((option) => {
      option.addEventListener('click', (event) => {
        event.stopPropagation();
        els.member.value = option.dataset.memberOption;
        updateMemberChannels(true);
        autosaveCurrentTask();
        setMemberMenuOpen(false);
      });
    });

    els.projectTrigger.addEventListener('click', (event) => {
      event.stopPropagation();
      const open = !els.projectMenu.classList.contains('open');
      closeSchedulePickers();
      setMemberMenuOpen(false);
      els.frequencyMenu.classList.remove('open');
      els.frequencyTrigger.setAttribute('aria-expanded', 'false');
      setProjectMenuOpen(open);
    });
    els.projectMenu.querySelectorAll('[data-project-option]').forEach((option) => {
      option.addEventListener('click', (event) => {
        event.stopPropagation();
        els.project.value = option.dataset.projectOption;
        updateProjectPicker();
        autosaveCurrentTask();
        setProjectMenuOpen(false);
      });
    });
    els.feishu.addEventListener('change', () => { updateChannelCount(); autosaveCurrentTask(); });
    els.dingtalk.addEventListener('change', () => { updateChannelCount(); autosaveCurrentTask(); });
    els.scheduleRows.addEventListener('input', autosaveCurrentTask);
    els.scheduleRows.addEventListener('change', autosaveCurrentTask);
    els.scheduleRows.addEventListener('click', (event) => {
      const trigger = event.target.closest('[data-open-schedule-picker]');
      if (trigger) {
        event.stopPropagation();
        const pickerName = trigger.dataset.openSchedulePicker;
        const shouldOpen = openSchedulePicker !== pickerName;
        closeSchedulePickers();
        setMemberMenuOpen(false);
        setProjectMenuOpen(false);
        els.frequencyMenu.classList.remove('open');
        els.frequencyTrigger.setAttribute('aria-expanded', 'false');
        if (shouldOpen) {
          const popover = els.scheduleRows.querySelector(`[data-schedule-picker="${pickerName}"]`);
          popover?.classList.add('open');
          trigger.setAttribute('aria-expanded', 'true');
          openSchedulePicker = pickerName;
          if (pickerName === 'date') renderCalendarPicker();
        }
        return;
      }

      const step = event.target.closest('[data-time-step-unit]');
      if (step) {
        event.stopPropagation();
        const hourInput = document.getElementById('timeHourInput');
        const minuteInput = document.getElementById('timeMinuteInput');
        if (!hourInput || !minuteInput) return;
        let hour = clampNumber(hourInput.value, 0, 23, 9);
        let minute = clampNumber(minuteInput.value, 0, 59, 0);
        const amount = Number(step.dataset.timeStepValue || 0);
        if (step.dataset.timeStepUnit === 'hour') hour = (hour + amount + 24) % 24;
        else {
          const total = hour * 60 + minute + amount;
          const wrapped = (total % 1440 + 1440) % 1440;
          hour = Math.floor(wrapped / 60);
          minute = wrapped % 60;
        }
        updateTimeValue(hour, minute);
        return;
      }

      const preset = event.target.closest('[data-time-preset]');
      if (preset) {
        event.stopPropagation();
        const [hour, minute] = preset.dataset.timePreset.split(':');
        updateTimeValue(hour, minute, true);
        return;
      }

      const nav = event.target.closest('[data-calendar-nav]');
      if (nav) {
        event.stopPropagation();
        if (!calendarCursor) calendarCursor = new Date();
        calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() + Number(nav.dataset.calendarNav), 1);
        renderCalendarPicker();
        return;
      }

      const dateButton = event.target.closest('[data-calendar-date]');
      if (dateButton) {
        event.stopPropagation();
        const hidden = document.getElementById('scheduleDate');
        const label = document.getElementById('scheduleDateLabel');
        if (!hidden) return;
        hidden.value = dateButton.dataset.calendarDate;
        if (label) label.textContent = formatDateLabel(hidden.value);
        const [year, month] = hidden.value.split('-').map(Number);
        calendarCursor = new Date(year, month - 1, 1);
        renderCalendarPicker();
        autosaveCurrentTask();
        closeSchedulePickers();
        return;
      }

      const weekdayButton = event.target.closest('[data-weekday-value]');
      if (weekdayButton) {
        event.stopPropagation();
        const hidden = document.getElementById('scheduleWeekday');
        const label = document.getElementById('scheduleWeekdayLabel');
        if (!hidden) return;
        hidden.value = weekdayButton.dataset.weekdayValue;
        if (label) label.textContent = hidden.value;
        autosaveCurrentTask();
        closeSchedulePickers();
      }
    });
    els.scheduleRows.addEventListener('focusout', (event) => {
      if (!event.target.matches('#timeHourInput, #timeMinuteInput')) return;
      requestAnimationFrame(() => {
        const hourInput = document.getElementById('timeHourInput');
        const minuteInput = document.getElementById('timeMinuteInput');
        if (hourInput && minuteInput) updateTimeValue(hourInput.value, minuteInput.value);
      });
    });

    els.frequencyTrigger.addEventListener('click', (event) => {
      event.stopPropagation();
      const open = !els.frequencyMenu.classList.contains('open');
      setMemberMenuOpen(false);
      setProjectMenuOpen(false);
      closeSchedulePickers();
      els.frequencyMenu.classList.toggle('open', open);
      els.frequencyTrigger.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    els.frequencyMenu.querySelectorAll('[data-frequency]').forEach((button) => {
      button.addEventListener('click', (event) => {
        event.stopPropagation();
        currentFrequency = button.dataset.frequency;
        renderSchedule({ frequency: currentFrequency });
        els.frequencyMenu.classList.remove('open');
        els.frequencyTrigger.setAttribute('aria-expanded', 'false');
        autosaveCurrentTask();
      });
    });

    els.form.addEventListener('submit', (event) => event.preventDefault());

    document.addEventListener('click', (event) => {
      if (!event.target.closest('.schedule-panel')) {
        els.frequencyMenu.classList.remove('open');
        els.frequencyTrigger.setAttribute('aria-expanded', 'false');
        closeSchedulePickers();
      }
      if (!event.target.closest('.member-picker')) setMemberMenuOpen(false);
      if (!event.target.closest('.project-picker')) setProjectMenuOpen(false);
      if (!event.target.closest('#taskCreateChooser') && !event.target.closest('#taskPageCreateButton')) {
        setTaskCreateChooserOpen(false);
      }
      if (!event.target.closest('.scheduled-task-item') && openTaskMenuId !== null) {
        openTaskMenuId = null;
        renderTaskList();
      }
    });
    els.splitter.addEventListener('pointerdown', (event) => {
      if (els.shell.classList.contains('overview') || event.button !== 0) return;
      event.preventDefault();
      splitterDrag = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startWidth: els.taskPane.getBoundingClientRect().width
      };
      els.splitter.setPointerCapture?.(event.pointerId);
      els.splitter.classList.add('is-resizing');
      document.body.classList.add('task-splitter-resizing');
    });
    els.splitter.addEventListener('pointermove', (event) => {
      if (!splitterDrag || splitterDrag.pointerId !== event.pointerId) return;
      setTaskListWidth(splitterDrag.startWidth + event.clientX - splitterDrag.startX);
    });
    const finishSplitterDrag = (event) => {
      if (!splitterDrag || (event.pointerId !== undefined && splitterDrag.pointerId !== event.pointerId)) return;
      try { els.splitter.releasePointerCapture?.(splitterDrag.pointerId); } catch {}
      splitterDrag = null;
      els.splitter.classList.remove('is-resizing');
      document.body.classList.remove('task-splitter-resizing');
    };
    els.splitter.addEventListener('pointerup', finishSplitterDrag);
    els.splitter.addEventListener('pointercancel', finishSplitterDrag);
    els.splitter.addEventListener('dblclick', () => setTaskListWidth(TASK_LIST_DEFAULT_WIDTH));
    els.splitter.addEventListener('keydown', (event) => {
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End', 'Enter'].includes(event.key)) return;
      event.preventDefault();
      const current = els.taskPane.getBoundingClientRect().width;
      if (event.key === 'Home' || event.key === 'Enter') setTaskListWidth(TASK_LIST_DEFAULT_WIDTH);
      else if (event.key === 'End') setTaskListWidth(Number.MAX_SAFE_INTEGER);
      else setTaskListWidth(current + (event.key === 'ArrowLeft' ? -1 : 1) * (event.shiftKey ? 24 : 8));
    });

    window.addEventListener('resize', () => {
      if (els.shell.classList.contains('overview')) return;
      if (els.shell.classList.contains('editor-closed')) setTaskListWidth(Number.MAX_SAFE_INTEGER);
      else setTaskListWidth(els.taskPane.getBoundingClientRect().width);
    });

    window.addEventListener('beforeunload', flushAutosave);

    const params = new URLSearchParams(location.search);
    if (params.get('empty') === '1') tasks = [];
    const requestedSplit = Number(params.get('split'));
    if (Number.isFinite(requestedSplit) && requestedSplit > 0) setTaskListWidth(requestedSplit);
    const requestedView = params.get('view');
    const requestedTask = params.get('task');
    if (requestedView === 'create') {
      beginCreate(params.get('template'));
      const requestedFrequency = params.get('frequency');
      if (requestedFrequency && frequencyNames[requestedFrequency]) {
        currentFrequency = requestedFrequency;
        renderSchedule({ frequency: requestedFrequency, date: '2026-09-05', time: '09:00', weekday: '星期五' });
      }
    } else if (requestedTask && tasks.some((task) => task.id === requestedTask)) openDetail(requestedTask);
    else showOverview();

    if (params.get('pane') === 'closed') requestAnimationFrame(() => setTaskListWidth(Number.MAX_SAFE_INTEGER));
    if (params.get('channels') === 'open') els.channelDisclosure.open = true;
    const requestedMenu = params.get('menu');
    if (requestedMenu === 'frequency') requestAnimationFrame(() => {
      els.frequencyMenu.classList.add('open');
      els.frequencyTrigger.setAttribute('aria-expanded', 'true');
    });
    if (requestedMenu === 'member') requestAnimationFrame(() => setMemberMenuOpen(true));
    if (['time', 'date', 'weekday'].includes(requestedMenu)) requestAnimationFrame(() => {
      const trigger = els.scheduleRows.querySelector(`[data-open-schedule-picker="${requestedMenu}"]`);
      const popover = els.scheduleRows.querySelector(`[data-schedule-picker="${requestedMenu}"]`);
      if (trigger && popover) {
        trigger.setAttribute('aria-expanded', 'true');
        popover.classList.add('open');
        openSchedulePicker = requestedMenu;
        if (requestedMenu === 'date') renderCalendarPicker();
      }
    });
    if (params.get('taskMenu')) requestAnimationFrame(() => {
      openTaskMenuId = params.get('taskMenu');
      renderTaskList();
    });
  </script>
</body>
</html>
