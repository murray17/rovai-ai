/* Revision 2: keep production detail typography and spacing. */
:root{--resource-link:#2b66d9;--resource-link-hover:#1e4fb8;--diff-add:#3e775c;--diff-remove:#a24c46;--diff-add-soft:#e7f1ea;--diff-remove-soft:#f7e6e3}
[data-theme=night]{--resource-link:#84b0ff;--resource-link-hover:#b3d0ff;--diff-add:#82b695;--diff-remove:#d6857f;--diff-add-soft:#1a2b22;--diff-remove-soft:#321e1d}
.after .evidence{background:var(--shell-result-canvas)}
.after .evidence pre{padding:8px 9px;max-height:min(220px,30vh);overflow:auto;font-weight:400;color:var(--evidence-muted)}
.before .evidence pre{max-height:min(220px,30vh)}
.evidence pre{overscroll-behavior:contain;scrollbar-gutter:stable}
.status-placeholder{visibility:hidden}
.file-row{grid-template-columns:16px minmax(0,1fr) auto 20px}

.file-link{display:block;border:0;border-radius:2px;min-height:28px;min-width:0;max-width:100%;padding:0;color:var(--muted);background:transparent;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-decoration-line:underline;text-decoration-style:dashed;text-decoration-thickness:1px;text-underline-offset:3px;font:inherit;text-align:left}
.file-link:hover,.file-link:active{color:var(--resource-link-hover);background:transparent;transform:none;text-decoration-style:solid}
.file-link:focus-visible{color:var(--resource-link-hover);outline:2px solid var(--focus);outline-offset:2px;text-decoration-style:solid}
.file-link-wrap{min-width:0;max-width:100%;position:relative}
.file-path-tip{display:none;position:absolute;left:0;bottom:calc(100% + 5px);padding:4px 7px;z-index:3;background:var(--raised);border:1px solid var(--strong);border-radius:4px;font:10px/1.5 var(--mono);color:var(--ink);max-width:320px;white-space:normal;overflow-wrap:anywhere;pointer-events:none}
.file-link-wrap:hover .file-path-tip,.file-link-wrap:focus-within .file-path-tip{display:block}
.diff-toggle{position:relative;display:grid;place-items:center;width:20px;min-height:28px;height:28px;border:0;padding:0;border-radius:5px;background:transparent;color:var(--muted)}
.diff-toggle:before{content:"";position:absolute;inset:0 -2px}
.diff-toggle svg{width:14px;height:14px;transition:transform 120ms ease}
.diff-toggle[aria-expanded=true] svg{transform:rotate(180deg)}
.file-stats{display:flex;gap:6px;font:10px/1.35 var(--mono);white-space:nowrap}.file-stats span:first-child{color:var(--diff-add)}.file-stats span:last-child{color:var(--diff-remove)}
.file-diff{min-width:0;max-height:min(220px,30vh);overflow:auto;margin:3px 0 8px;border:1px solid var(--evidence-line);border-radius:6px;background:var(--raised);color:var(--evidence-ink);font:10px/1.5 var(--mono)}
.diff-line{display:grid;grid-template-columns:20px 34px 34px minmax(0,1fr);min-width:520px;min-height:20px}.diff-line>span{display:grid;place-items:center;color:var(--evidence-muted)}.diff-line code{padding:2px 8px;white-space:pre}.diff-line.add{background:var(--diff-add-soft)}.diff-line.remove{background:var(--diff-remove-soft)}.diff-line.meta{display:block;padding:3px 8px;color:var(--evidence-muted);background:var(--surface)}
.after .static:hover{background:transparent;color:var(--muted)}.after .static:hover .row-title{color:var(--muted)}
.review-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:10px;text-align:left;line-height:1.75}.review-table th,.review-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}.review-table th{color:var(--ink);font-weight:550}.review-table td{color:var(--muted)}.review-table th:first-child,.review-table td:first-child{padding-left:0;width:105px}.review-table-wrap{overflow:auto;max-width:100%}.review-table code{font-size:10px}
.inline-example{display:grid;gap:6px;margin-top:14px}.state-sample{margin-bottom:14px}

[hidden]{display:none!important}

function row(d,after,{staticRow=false,group=false,forceState}={}){const state=forceState||toolState(d.id),title=group?groupText(after):(after?d.title:d.old);return `<${staticRow?'div':'summary'} class="row${staticRow?' static':''}${group?' group-row':''}"><span class="type ${d.type}" aria-hidden="true">${svg(icons[d.type])}</span><span class="row-title${d.type==='shell'?' mono':''}" title="${escapeHTML(title)}">${group?'<strong>'+escapeHTML(title)+'</strong>':escapeHTML(title)}</span>${group?groupIcon(state,after):stateIcon(state,after)}<span class="chevron${staticRow?' placeholder':''}" aria-hidden="true">${svg(icons.chevron)}</span>${group&&after?'':`<span class="tooltip" aria-hidden="true">${escapeHTML(labels[state])}</span>`}</${staticRow?'div':'summary'}>`}
function diffMarkup(d){const lines=d.operation==='add'?[['meta','@@ -0,0 +1,2 @@'],['add','+','','1','export const ready = true;'],['add','+','','2','export const pending = false;']]:[['meta','@@ -1,1 +1,1 @@'],['remove','−','1','','export const mode = "default";'],['add','+','','1','export const mode = "quiet";']];return lines.map(([kind,...v])=>kind==='meta'?`<div class="diff-line meta">${escapeHTML(v[0])}</div>`:`<div class="diff-line ${kind}"><span>${v[0]}</span><span>${v[1]}</span><span>${v[2]}</span><code>${escapeHTML(v[3])}</code></div>`).join('')}
function fileOperation(d,after){if(!after&&d.diff){return `<details data-key="${d.id}" class="file-operation"${expanded.has(d.id)?' open':''}><summary class="row file-row"><span class="type">${svg(icons.read)}</span><span class="row-title">${escapeHTML(d.old)}</span><span class="file-stats"><span>+${d.plus}</span><span>−${d.minus}</span></span><span class="chevron">${svg(icons.chevron)}</span></summary><div class="file-diff" role="region" tabindex="0" aria-label="${escapeHTML(d.path)} 的文件差异">${diffMarkup(d)}</div></details>`}const read=d.operation==='read',verb=read?'阅读':d.operation==='add'?'新增':'编辑';if(!after)return row(d,false,{staticRow:true});return `<div class="file-operation" data-file-row="${d.id}"><div class="row static${d.diff?' file-row':''}"><span class="type" aria-hidden="true">${svg(read?icons.read:icons.pencil)}</span><span class="file-title"><span>${verb}</span>${d.path?fileLink(d):'<span>文件</span>'}</span>${d.diff?`<span class="file-stats" aria-label="新增 ${d.plus} 行，删除 ${d.minus} 行"><span>+${d.plus}</span><span>−${d.minus}</span></span>`:stateIcon(toolState(d.id),true)}${d.diff?`<button class="diff-toggle" data-diff="${d.id}" aria-expanded="${expanded.has(d.id)}" aria-controls="diff-${d.id}" aria-label="展开或收起 ${escapeHTML(d.path)} 的文件差异">${svg(icons.chevron)}</button>`:'<span class="chevron placeholder" aria-hidden="true"></span>'}</div>${d.diff?`<div class="file-diff" id="diff-${d.id}" role="region" tabindex="0" aria-label="${escapeHTML(d.path)} 的文件差异"${expanded.has(d.id)?'':' hidden'}>${diffMarkup(d)}</div>`:''}</div>`}
function content(d){const s=toolState(d.id);if(s==='failed')return 'Error: request failed\n工具返回失败。';if(s==='waiting')return '等待审批后继续。';if(s==='running'||s==='cancelling')return d.type==='web'?'搜索 Electron 窗口焦点问题\n等待工具返回。':'等待工具返回。';if(s==='unknown')return '仅收到活动记录；尚无明确成功或失败结果。';if(s==='stopped')return '操作已停止；未收到完整结果。';return d.before}
function detail(d){return `<div class="detail"><div class="evidence"><pre role="region" aria-label="${escapeHTML(d.old)} · 详情" tabindex="0">${escapeHTML(content(d))}</pre></div></div>`}
function tool(d,after){if(d.diff||d.operation&&after||d.static)return fileOperation(d,after);return `<details data-key="${d.id}" class="tool tool-${d.type}"${expanded.has(d.id)?' open':''}>${row(d,after)}${detail(d)}</details>`}
function stateSamples(after){const samples=[['running','执行中 · 搜索文档'],['waiting','等待审批 · 更新配置'],['completed',after?'完成了 1 个步骤':'已执行 1 项操作'],['failed',after?'完成了 1 个步骤':'已执行 1 项操作'],['stopped',after?'完成了 1 个步骤':'已执行 1 项操作']];return samples.map(([s,t],i)=>`<details class="state-sample" data-key="state-${i}" open><summary class="row group-row"><span class="type">${svg(icons.group)}</span><strong class="row-title">${t}</strong>${groupIcon(s,after)}<span class="chevron">${svg(icons.chevron)}</span></summary>${row({id:'state-child-'+i,type:'tool',old:'workspace/inspect',title:'检查工作区'},after,{staticRow:true,forceState:s})}</details>`).join('')+`<div class="hint-box">${after?'终态组不显示图标，状态轨仍占位。组摘要只显示“完成了 x 个步骤”；展开后的每一步仍有明确图形。':'原版组的运行、等待、失败有不同轮廓，子行均为色点。打开“单色检查”可以比较辨识度。'}</div>`}
function renderStage(after){if(active==='states')return stateSamples(after);const items=selectedItems();if(active==='static')return `<p class="stage-note">只悬浮文件名／差异箭头，比较反馈</p>${items.map(d=>tool(d,after)).join('')}<div class="hint-box">${after?'文件名：虚线 → 加强链接色与实线；空白与动作文字：无反馈；箭头：独立 hover 与展开。':'静态文件操作仍有整行 hover，有 Diff 时整行可展开。'}</div>`;return `<details class="tool-group" data-key="group"${groupOpen.get(active)!==false?' open':''}>${row({type:'group'},after,{group:true,forceState:groupState(after)})}<div class="group-items">${items.map(d=>tool(d,after)).join('')}</div></details>`}
function stateLibrary(){const info=[['running','保留','组与子行都使用'],['completed','保留','仅子行；明确成功'],['failed','保留','仅子行；明确失败'],['skipped','保留','明确未执行时使用'],['waiting','补齐','组与子行都使用'],['stopped','补齐','仅子行；开始后停止'],['unknown','补齐','仅子行；结果未证实'],['queued','Run 专用','不用于 Tool 组终态'],['cancelling','过渡态','子行弧线；组只写文字']];return `<div class="extra-title"><h3>子行状态图形</h3><p>组摘要仅使用进行中和等待审批两种图标；终态组只显示“完成了 x 个步骤”。</p></div><div class="status-library after">${info.map(([s,t,n])=>`<div class="status-example">${stateIcon(s,true)}<div><strong>${labels[s]}</strong><p>${t} · ${n}</p></div></div>`).join('')}</div>`}
function runtimeTable(){return `<div class="extra-title"><h3>Runtime 识别核查</h3><p>2026.09.06 已使用本机真实配置完成 14 个 Runtime 的隔离矩阵；完整结果见 <a href="runtime-acceptance.md">Runtime 文件操作验收</a>。</p></div><div class="hint-box">可靠 structured read/write 已接入工具行和文件预览。只有明确 add 显示“新增”；path-only write、update Diff 或新增证据不足时显示“编辑”；没有单文件终态证据时保持原工具／Run 级回退。</div><div class="review-table-wrap"><table class="review-table"><thead><tr><th>Runtime</th><th>阅读结果</th><th>新增 / 编辑结果</th></tr></thead><tbody><tr><td>Codex</td><td>0.153.4 的 cat、head、tail、sed structured read 均显示“阅读”，不解析命令前缀。</td><td>明确 add 显示“新增”；update 显示“编辑”，保留原 Diff。</td></tr><tr><td>ACP 细粒度组</td><td>OpenCode、Copilot、Kiro、Qoder、Qwen、TRAE、Kimi 的可靠 read 均通过；Qwen 写入路径存在已记录的 basename-only 边界。</td><td>只有 path 或 Runtime 报 update 时统一“编辑”，不从当前磁盘猜“新增”。</td></tr><tr><td>Claude</td><td>Read 与 matching 成功 result 后显示“阅读”。</td><td>Write 保守显示“编辑”；Edit 继续展示 exact-mutation 片段。</td></tr><tr><td>Pi</td><td>0.84.4 以同一 toolCallId 关联 start 参数与成功 end，精确显示“阅读”。</td><td>write/edit 精确路径通过，保守显示“编辑”，不虚构 Diff。</td></tr><tr><td>Antigravity / Grok</td><td>无可准入的单文件终态时保持原工具／Run 级回退。</td><td>未报告或未完成的写入不补造文件行。</td></tr><tr><td>CodeBuddy / Cursor</td><td>分别被默认模型 Ready 与 macOS arm64 平台资格准入阻断。</td><td>未绕过产品准入，也未把未运行写成通过。</td></tr></tbody></table></div><p class="stage-note">真实验收同时检查 live 与历史回读、Files Changed 排除、已有空文件和失败回退。文件删除后的点击由 production Electron fixture 验证为只显示红色 Toast，当前页面和已有预览不切换。</p>`}
function extras(){if(active==='states'||active==='overview')return stateLibrary();if(active==='titles')return `<div class="extra-title"><h3>阅读识别：正例与反例</h3><p>下面是已确认规则的合成示例：有可靠“只读 + 单文件路径”才转换；不按命令前缀盲猜。</p></div><div class="comparison" style="margin-top:12px"><div class="panel before"><div class="panel-head">当前 Shell 表达</div><div class="stage">${extrasData.slice(1,7).map(d=>tool(d,false)).join('')}</div></div><div class="panel after"><div class="panel-head">可靠阅读转链接；写入／复合命令仍保留 Shell</div><div class="stage">${extrasData.slice(1,7).map(d=>tool(d,true)).join('')}</div></div></div><p class="stage-note">cat、head、tail、sed -n 这些示例假定 Runtime 已明确报告只读操作与路径；sed -i 和含测试的复合命令不能缩成“阅读文件”。</p><div style="margin-top:26px">${runtimeTable()}</div>`;return ''}
function render(){const p=pages.find(x=>x.id===active);$('#section-title').textContent=p.title;$('#intro').textContent=p.intro;$('#page-count').textContent=active==='overview'?'REVISION 03':String(pages.indexOf(p)).padStart(2,'0')+' / 06';$('#before-caption').innerHTML=`<strong>${p.bc}</strong><p>${p.bd}</p>`;$('#after-caption').innerHTML=`<strong>${p.ac}</strong><p>${p.ad}</p>`;$('#fix').textContent=p.fix;$('#boundary').textContent=p.boundary;$('#before-stage').innerHTML=renderStage(false);$('#after-stage').innerHTML=renderStage(true);$('#extras').innerHTML=extras();$('#scenario-label').hidden=active!=='overview';$('#file-state-label').hidden=!['overview','titles','static'].includes(active);$('#stop').hidden=active!=='cancelling';$('#expand').hidden=active==='states';$('#stop').textContent=stopPhase==='running'?'演示停止':stopPhase==='cancelling'?'模拟收到停止终态':'重新演示';$('#expand').textContent=openAll?'全部收起':'全部展开';$$('#nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===active)));bindStage()}
function syncKey(key,open){if(key==='group')groupOpen.set(active,open);else if(open)expanded.add(key);else expanded.delete(key);$$('.stage details[data-key]').filter(el=>el.dataset.key===key).forEach(el=>{if(el.open!==open)el.open=open});$$('[data-diff]').filter(b=>b.dataset.diff===key).forEach(b=>{b.setAttribute('aria-expanded',String(open));const region=$('#'+b.getAttribute('aria-controls'));if(region)region.hidden=!open})}
function bindStage(){$$('.stage details[data-key]').forEach(el=>el.addEventListener('toggle',()=>{if(el.isConnected)syncKey(el.dataset.key,el.open)}));$$('[data-diff]').forEach(b=>b.addEventListener('click',()=>syncKey(b.dataset.diff,b.getAttribute('aria-expanded')!=='true')));$$('[data-file]').forEach(b=>b.addEventListener('click',()=>openPreview(b.dataset.file,b)));$$('.stage [role=region]').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();const host=el.closest('.file-operation,.tool');(host?.querySelector('.diff-toggle')||host?.querySelector('summary'))?.focus()}}))}
function announce(text){$('#announcement').textContent=text}
function previewContent(path){if(path==='docs/README.md')return '# Rovai-ai 文档导航\n\n本文定义文档职责、权威边界与读取顺序。\n\n## 从这里开始\n\n1. 用户指南\n2. 开发者指南\n3. 当前架构';if(path==='src/status.ts')return 'export const ready = true;\nexport const pending = false;';if(path==='src/settings.ts')return 'export const mode = "quiet";';return '// Runtime adapter\nexport const adapter = "acp";'}
let toastTimer=null,toastTrigger=null;
function dismissFileError(){clearTimeout(toastTimer);const focused=$('#file-error-toast').contains(document.activeElement);$('#file-error-toast').hidden=true;$('#file-error-message').textContent='';if(focused&&toastTrigger?.isConnected)toastTrigger.focus()}
function scheduleToastDismiss(){clearTimeout(toastTimer);toastTimer=setTimeout(dismissFileError,5000)}
function showFileError(trigger){toastTrigger=trigger;const toast=$('#file-error-toast');toast.hidden=false;$('#file-error-message').textContent='无法打开该文件';scheduleToastDismiss()}
function paintPreview(){const pane=$('#file-preview');$('#preview-file').textContent=fileName(currentPreview);$('#preview-path').textContent=currentPreview;$('#preview-content').innerHTML=`<pre>${escapeHTML(previewContent(currentPreview))}</pre>`;pane.hidden=false}
function openPreview(path,trigger){if(fileMode==='missing'){showFileError(trigger);return}dismissFileError();currentPreview=path;previewTrigger=trigger;paintPreview();document.body.classList.add('preview-open');const compact=innerWidth<=1100;$('.workspace').inert=compact;$('.masthead').inert=compact;$('#preview-close').focus();announce('已打开文件预览：'+path)}
function closePreview(){$('#file-preview').hidden=true;document.body.classList.remove('preview-open');$('.workspace').inert=false;$('.masthead').inert=false;currentPreview=null;if(previewTrigger?.isConnected)previewTrigger.focus();else $('#main').focus()}
document.body.insertAdjacentHTML('beforeend',`<aside id="file-preview" class="preview-pane" role="region" aria-label="文件预览演示" hidden><div class="preview-header"><h2>文件预览</h2><button id="preview-close">返回对比稿</button></div><div class="preview-tabs">${svg(icons.read)}<span id="preview-file"></span></div><div class="preview-path" id="preview-path"></div><div class="preview-content" id="preview-content"></div><div class="preview-foot">交互演示 · 预览为合成内容，不读取真实文件。<br>关闭后返回刚才的文件名；Esc 也可返回。</div></aside>`);
document.body.insertAdjacentHTML('beforeend',`<div id="file-error-toast" class="file-error-toast" hidden>${svg(statePaths.failed)}<span id="file-error-message" role="alert" aria-atomic="true"></span><button id="toast-close" class="toast-close" aria-label="关闭提示">${svg('<path d="m4.5 4.5 7 7m0-7-7 7"/>')}</button></div>`);
$('#toast-close').addEventListener('click',dismissFileError);
$('#file-error-toast').addEventListener('pointerenter',()=>clearTimeout(toastTimer));
$('#file-error-toast').addEventListener('pointerleave',()=>{if(!$('#file-error-toast').contains(document.activeElement))scheduleToastDismiss()});
$('#file-error-toast').addEventListener('focusin',()=>clearTimeout(toastTimer));
$('#file-error-toast').addEventListener('focusout',scheduleToastDismiss);
$('#preview-close').addEventListener('click',closePreview);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#file-error-toast').hidden){e.preventDefault();dismissFileError()}else if(currentPreview){e.preventDefault();closePreview()}}});
window.addEventListener('resize',()=>{const compact=!!currentPreview&&innerWidth<=1100;$('.workspace').inert=compact;$('.masthead').inert=compact});
$('#nav').innerHTML=pages.map((p,i)=>`<button data-page="${p.id}" aria-pressed="${i===0}"><span class="num">${i===0?'—':String(i).padStart(2,'0')}</span><span class="nav-copy">${p.nav}<small>${p.tag}</small></span></button>`).join('');
$$('#nav button').forEach(b=>b.addEventListener('click',()=>{if(currentPreview)closePreview();active=b.dataset.page;scenario='success';$('#scenario').value=scenario;expanded.clear();if(active!=='titles')data.forEach(d=>expanded.add(d.id));openAll=active!=='titles';groupOpen.set(active,true);stopPhase='running';render();announce('已切换到'+pages.find(p=>p.id===active).nav)}));
$$('[data-theme-choice]').forEach(b=>b.addEventListener('click',()=>{document.documentElement.dataset.theme=b.dataset.themeChoice;$$('[data-theme-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
$('#monochrome').addEventListener('change',e=>document.body.classList.toggle('mono-mode',e.target.checked));$('#motion').addEventListener('change',e=>document.body.classList.toggle('motion-off',e.target.checked));
$('#width').addEventListener('change',e=>$('#comparison').classList.toggle('narrow',e.target.value==='narrow'));$('#scenario').addEventListener('change',e=>{scenario=e.target.value;render();announce('场景：'+e.target.selectedOptions[0].textContent)});$('#file-state').addEventListener('change',e=>{fileMode=e.target.value;announce('演示文件状态：'+e.target.selectedOptions[0].textContent)});
$('#guides').addEventListener('click',e=>{const on=e.target.getAttribute('aria-pressed')!=='true';e.target.setAttribute('aria-pressed',String(on));$('#comparison').classList.toggle('with-guides',on);e.target.textContent=on?'隐藏对齐线':'显示对齐线'});
$('#expand').addEventListener('click',()=>{openAll=!openAll;$$('.stage details[data-key]').forEach(el=>syncKey(el.dataset.key,openAll));$$('[data-diff]').forEach(b=>syncKey(b.dataset.diff,openAll));$('#expand').textContent=openAll?'全部收起':'全部展开'});
$('#stop').addEventListener('click',()=>{stopPhase=stopPhase==='running'?'cancelling':stopPhase==='cancelling'?'stopped':'running';render();announce('演示状态：'+labels[stopPhase]);$('#stop').focus()});
render();
</script>
</body>
