<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 710" role="img"><title>Public HTTPS, private backend</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#69737d" stroke-width="1.5"/></marker></defs><rect width="840" height="710" rx="16" fill="#f7f8fa"/><g font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#23313b"><text x="32" y="40" font-size="24" font-weight="600" text-anchor="start">Public HTTPS, private backend</text><rect x="90" y="80" width="660" height="88" rx="10" fill="white" stroke="#cbd3da"/><text x="420.0" y="111" font-size="20" font-weight="600" text-anchor="middle">Browser · any permitted network</text><text x="420.0" y="137" font-size="18" font-weight="400" text-anchor="middle">https://agent.example.com</text><path d="M420 168V258" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#a)"/><text x="420" y="220" font-size="17" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" paint-order="stroke" stroke-linejoin="round">DNS → host IP · HTTPS :443</text><rect x="90" y="258" width="660" height="112" rx="10" fill="white" stroke="#cbd3da"/><text x="420.0" y="289" font-size="20" font-weight="600" text-anchor="middle">Host · Caddy reverse proxy</text><text x="420.0" y="315" font-size="18" font-weight="400" text-anchor="middle">TLS certificate · HTTP :80 → HTTPS</text><text x="420.0" y="341" font-size="18" font-weight="400" text-anchor="middle">Preserve Host, Origin, Authorization and streaming</text><path d="M420 370V472" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#a)"/><text x="420" y="425" font-size="17" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" paint-order="stroke" stroke-linejoin="round">Local HTTP · never exposed as a public port</text><rect x="90" y="472" width="660" height="112" rx="10" fill="white" stroke="#cbd3da"/><text x="420.0" y="503" font-size="20" font-weight="600" text-anchor="middle">Rovai Server · 127.0.0.1:8767</text><text x="420.0" y="529" font-size="18" font-weight="400" text-anchor="middle">--public-origin https://agent.example.com</text><text x="420.0" y="555" font-size="18" font-weight="400" text-anchor="middle">Owner login → workspace on this host</text><text x="420" y="632" font-size="18" font-weight="400" text-anchor="middle">Examples only: use your own domain and host</text><text x="420" y="664" font-size="18" font-weight="400" text-anchor="middle">Do not modify rovai.dev website DNS</text></g></svg>