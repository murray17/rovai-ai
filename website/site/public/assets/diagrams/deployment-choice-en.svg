<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 660" role="img"><title>Choose where work runs, then how to connect</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#69737d" stroke-width="1.5"/></marker></defs><rect width="840" height="660" rx="16" fill="#f7f8fa"/><g font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#23313b"><text x="32" y="40" font-size="24" font-weight="600" text-anchor="start">Choose where work runs, then how to connect</text><rect x="35" y="85" width="365" height="112" rx="10" fill="white" stroke="#cbd3da"/><text x="217.5" y="116" font-size="20" font-weight="600" text-anchor="middle">Desktop Web · 0.4.5</text><text x="217.5" y="142" font-size="18" font-weight="400" text-anchor="middle">Continue this Desktop workspace</text><text x="217.5" y="168" font-size="18" font-weight="400" text-anchor="middle">Keep the App running</text><rect x="440" y="85" width="365" height="112" rx="10" fill="white" stroke="#cbd3da"/><text x="622.5" y="116" font-size="20" font-weight="600" text-anchor="middle">Independent Server · 0.4.5</text><text x="622.5" y="142" font-size="18" font-weight="400" text-anchor="middle">A separate host and data root</text><text x="622.5" y="168" font-size="18" font-weight="400" text-anchor="middle">Install the native package</text><path d="M218 197V235H622V197M155 235H685" fill="none" stroke="#69737d" stroke-width="1.6"/><path d="M155 235V290" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#a)"/><path d="M420 235V290" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#a)"/><path d="M685 235V290" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#a)"/><text x="420" y="265" font-size="17" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" paint-order="stroke" stroke-linejoin="round">Choose a network route</text><rect x="35" y="290" width="240" height="164" rx="10" fill="white" stroke="#cbd3da"/><text x="155.0" y="321" font-size="20" font-weight="600" text-anchor="middle">Trusted LAN</text><text x="155.0" y="347" font-size="18" font-weight="400" text-anchor="middle">Desktop or Server</text><text x="155.0" y="373" font-size="18" font-weight="400" text-anchor="middle">Host IP + HTTP</text><text x="155.0" y="399" font-size="18" font-weight="400" text-anchor="middle">Same trusted network</text><rect x="300" y="290" width="240" height="164" rx="10" fill="white" stroke="#cbd3da"/><text x="420.0" y="321" font-size="20" font-weight="600" text-anchor="middle">Private tailnet</text><text x="420.0" y="347" font-size="18" font-weight="400" text-anchor="middle">Desktop: direct IP</text><text x="420.0" y="373" font-size="18" font-weight="400" text-anchor="middle">Server: Serve HTTPS</text><text x="420.0" y="399" font-size="18" font-weight="400" text-anchor="middle">Both devices connected</text><rect x="565" y="290" width="240" height="164" rx="10" fill="white" stroke="#cbd3da"/><text x="685.0" y="321" font-size="20" font-weight="600" text-anchor="middle">Public HTTPS</text><text x="685.0" y="347" font-size="18" font-weight="400" text-anchor="middle">Server + proxy</text><text x="685.0" y="373" font-size="18" font-weight="400" text-anchor="middle">Domain + certificate</text><text x="685.0" y="399" font-size="18" font-weight="400" text-anchor="middle">Owner login required</text><rect x="155" y="520" width="530" height="92" rx="10" fill="white" stroke="#cbd3da"/><text x="420.0" y="551" font-size="20" font-weight="600" text-anchor="middle">Open the chosen instance and log in</text><text x="420.0" y="577" font-size="18" font-weight="400" text-anchor="middle">Same host files · no automatic data sync</text><path d="M155 454V490H420V520" fill="none" stroke="#69737d" stroke-width="1.6"/><path d="M420 454V490H420V520" fill="none" stroke="#69737d" stroke-width="1.6"/><path d="M685 454V490H420V520" fill="none" stroke=