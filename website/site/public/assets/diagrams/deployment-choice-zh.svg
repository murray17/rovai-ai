信局域网</text><text x="155.0" y="347" font-size="18" font-weight="400" text-anchor="middle">Desktop / Server</text><text x="155.0" y="373" font-size="18" font-weight="400" text-anchor="middle">主机 IP + HTTP</text><text x="155.0" y="399" font-size="18" font-weight="400" text-anchor="middle">同一可信网络</text><rect x="300" y="290" width="240" height="164" rx="10" fill="white" stroke="#cbd3da"/><text x="420.0" y="321" font-size="20" font-weight="600" text-anchor="middle">Tailscale 私网</text><text x="420.0" y="347" font-size="18" font-weight="400" text-anchor="middle">Desktop：IP 直连</text><text x="420.0" y="373" font-size="18" font-weight="400" text-anchor="middle">Server：Serve HTTPS</text><text x="420.0" y="399" font-size="18" font-weight="400" text-anchor="middle">两端连接私网</text><rect x="565" y="290" width="240" height="164" rx="10" fill="white" stroke="#cbd3da"/><text x="685.0" y="321" font-size="20" font-weight="600" text-anchor="middle">公网 HTTPS</text><text x="685.0" y="347" font-size="18" font-weight="400" text-anchor="middle">Server + 反向代理</text><text x="685.0" y="373" font-size="18" font-weight="400" text-anchor="middle">域名 + 证书</text><text x="685.0" y="399" font-size="18" font-weight="400" text-anchor="middle">保留 Owner 登录</text><rect x="155" y="520" width="530" height="92" rx="10" fill="white" stroke="#cbd3da"/><text x="420.0" y="551" font-size="20" font-weight="600" text-anchor="middle">打开选定实例并登录</text><text x="420.0" y="577" font-size="18" font-weight="400" text-anchor="middle">使用主机文件 · 不自动同步数据</text><path d="M155 454V490H420V520" fill="none" stroke="#69737d" stroke-width="1.6"/><path d="M420 454V490H420V520" fill="none" stroke="#69737d" stroke-width="1.6"/><path d="M685 454V490H420V520" fill="none" stroke="#69737d" stroke-width="1.6"/></g></svg>
