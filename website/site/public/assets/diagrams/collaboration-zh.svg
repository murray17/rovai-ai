"url(#arrow)"/><text x="500.0" y="668" font-size="16" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" stroke-linejoin="round" paint-order="stroke">检查最终页面及变更</text><text x="40" y="778" font-size="16" font-weight="400" text-anchor="start">本例由用户主动交接。一次选择多位接收者，不会自动产生以上顺序。</text></g></svg>