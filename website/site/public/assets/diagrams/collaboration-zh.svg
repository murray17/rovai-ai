<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 810" role="img"><title>一次实现与审查</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#69737d" stroke-width="1.5"/></marker></defs><rect width="1000" height="810" rx="20" fill="#f7f8fa"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#23313b"><text x="40" y="40" font-size="24" font-weight="650" text-anchor="start">一次实现与审查</text><rect x="13" y="70" width="154" height="55" rx="12" fill="white" stroke="#cbd3da"/><text x="90.0" y="100" font-size="20" font-weight="650" text-anchor="middle">用户</text><path d="M90 125V730" stroke="#cbd3da" stroke-dasharray="5 6"/><rect x="218" y="70" width="154" height="55" rx="12" fill="white" stroke="#cbd3da"/><text x="295.0" y="100" font-size="20" font-weight="650" text-anchor="middle">Rovai</text><path d="M295 125V730" stroke="#cbd3da" stroke-dasharray="5 6"/><rect x="423" y="70" width="154" height="55" rx="12" fill="white" stroke="#cbd3da"/><text x="500.0" y="100" font-size="20" font-weight="650" text-anchor="middle">实现队员</text><path d="M500 125V730" stroke="#cbd3da" stroke-dasharray="5 6"/><rect x="628" y="70" width="154" height="55" rx="12" fill="white" stroke="#cbd3da"/><text x="705.0" y="100" font-size="20" font-weight="650" text-anchor="middle">审查队员</text><path d="M705 125V730" stroke="#cbd3da" stroke-dasharray="5 6"/><rect x="833" y="70" width="154" height="55" rx="12" fill="white" stroke="#cbd3da"/><text x="910.0" y="100" font-size="20" font-weight="650" text-anchor="middle">项目文件</text><path d="M910 125V730" stroke="#cbd3da" stroke-dasharray="5 6"/><path d="M90 168H295" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#arrow)"/><text x="192.5" y="156" font-size="16" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" stroke-linejoin="round" paint-order="stroke">选择实现队员并发送范围</text>