<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 575" role="img"><title>Inside one trusted network</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#69737d" stroke-width="1.5"/></marker></defs><rect width="840" height="575" rx="16" fill="#f7f8fa"/><g font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#23313b"><text x="32" y="40" font-size="24" font-weight="600" text-anchor="start">Inside one trusted network</text><rect x="70" y="88" width="700" height="88" rx="10" fill="white" stroke="#cbd3da"/><text x="420.0" y="119" font-size="20" font-weight="600" text-anchor="middle">Phone / another computer · browser</text><text x="420.0" y="145" font-size="18" font-weight="400" text-anchor="middle">Use the host IP, not your own localhost</text><path d="M420 176V300" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#a)"/><text x="420" y="238" font-size="17" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" paint-order="stroke" stroke-linejoin="round">HTTP over the LAN · owner login</text><rect x="70" y="305" width="700" height="112" rx="10" fill="white" stroke="#cbd3da"/><text x="420.0" y="336" font-size="20" font-weight="600" text-anchor="middle">Rovai host · 192.168.1.50</text><text x="420.0" y="362" font-size="18" font-weight="400" text-anchor="middle">Desktop Web :8766  OR  Server :8767</text><text x="420.0" y="388" font-size="18" font-weight="400" text-anchor="middle">Listener + firewall permit this trusted subnet</text><rect x="120" y="468" width="600" height="70" rx="10" fill="white" stroke="#cbd3da"/><text x="420.0" y="499" font-size="20" font-weight="600" text-anchor="middle">No public port forwarding · keep host awake</text></g></svg>