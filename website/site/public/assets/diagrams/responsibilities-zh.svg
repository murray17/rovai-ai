<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 685" role="img"><title>职责与数据流</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#69737d" stroke-width="1.5"/></marker></defs><rect width="1000" height="685" rx="20" fill="#f7f8fa"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#23313b"><text x="40" y="40" font-size="24" font-weight="650" text-anchor="start">职责与数据流</text><rect x="30" y="100" width="190" height="100" rx="12" fill="white" stroke="#cbd3da"/><text x="125.0" y="130" font-size="20" font-weight="650" text-anchor="middle">用户</text><text x="125.0" y="156" font-size="16" font-weight="400" text-anchor="middle">目标 · 接收队员</text><text x="125.0" y="179" font-size="16" font-weight="400" text-anchor="middle">决定 · 验收</text><rect x="335" y="100" width="280" height="100" rx="12" fill="white" stroke="#cbd3da"/><text x="475.0" y="130" font-size="20" font-weight="650" text-anchor="middle">Rovai</text><text x="475.0" y="156" font-size="16" font-weight="400" text-anchor="middle">会话 · 寻址 · 记录</text><text x="475.0" y="179" font-size="16" font-weight="400" text-anchor="middle">队员身份与配置</text><rect x="335" y="315" width="280" height="105" rx="12" fill="white" stroke="#cbd3da"/><text x="475.0" y="345" font-size="20" font-weight="650" text-anchor="middle">原生智能体</text><text x="475.0" y="371" font-size="16" font-weight="400" text-anchor="middle">Codex CLI / Claude Code / …</text><text x="475.0" y="394" font-size="16" font-weight="400" text-anchor="middle">模型与工具能力</text><rect x="745" y="305" width="225" height="125" rx="12" fill="white" stroke="#cbd3da"/><text x="857.5" y="335" font-size="20" font-weight="650" text-anchor="middle">模型服务</text><text x="857.5" y="361" font-size="16" font-weight="400" text-anchor="middle">取决于智能体及服务配置</text><text x="857.5" y="384" font-size="16" font-weight="400" text-anchor="middle">可能