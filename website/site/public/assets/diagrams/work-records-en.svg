<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img"><title>Different records for the same work</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#69737d" stroke-width="1.5"/></marker></defs><rect width="1000" height="660" rx="20" fill="#f7f8fa"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#23313b"><text x="40" y="40" font-size="24" font-weight="650" text-anchor="start">Different records for the same work</text><rect x="40" y="85" width="280" height="110" rx="12" fill="white" stroke="#cbd3da"/><text x="180.0" y="115" font-size="20" font-weight="650" text-anchor="middle">Mission</text><text x="180.0" y="141" font-size="16" font-weight="400" text-anchor="middle">Longer goal and board status</text><text x="180.0" y="164" font-size="16" font-weight="400" text-anchor="middle">Optional for a conversation</text><rect x="40" y="325" width="280" height="110" rx="12" fill="white" stroke="#cbd3da"/><text x="180.0" y="355" font-size="20" font-weight="650" text-anchor="middle">Conversation</text><text x="180.0" y="381" font-size="16" font-weight="400" text-anchor="middle">Participants and messages</text><text x="180.0" y="404" font-size="16" font-weight="400" text-anchor="middle">Shared working context</text><rect x="640" y="85" width="315" height="110" rx="12" fill="white" stroke="#cbd3da"/><text x="797.5" y="115" font-size="20" font-weight="650" text-anchor="middle">Task</text><text x="797.5" y="141" font-size="16" font-weight="400" text-anchor="middle">Named responsibility and owner</text><text x="797.5" y="164" font-size="16" font-weight="400" text-anchor="middle">Creating one does not start a Run</text><rect x="640" y="325" width="315" height="110" rx="12" fill="white" stroke="#cbd3da"/><text x="797.5" y="355" font-size="20" font-weight="650" text-anchor="middle">Run</text><text x="797.5" y="381" font-size="16" font-weight="400" text-anchor="middle">One claimed execution</text><text x="797.5" y="404" font-size="16" font-weight="400" text-anchor="middle">Input, configuration and output</text><rect x="335" y="545" width="330" height="80" rx="12" fill="white" stroke="#cbd3da"/><text x="500.0" y="575" font-size="20" font-weight="650" text-anchor="middle">Workspace files</text><text x="500.0" y="601" font-size="16" font-weight="400" text-anchor="middle">Actual files, changes and delivery</text><path d="M180 195V325" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#arrow)"/><text x="180" y="263" font-size="16" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" stroke-linejoin="round" paint-order="stroke">Associated team conversation</text><path d="M320 350H455V140H640" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#arrow)"/><text x="464" y="120" font-size="16" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" stroke-linejoin="round" paint-order="stroke">Keeps responsibility records</text><path d="M320 400H640" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#arrow)"/><text x="480" y="385" font-size="16" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" stroke-linejoin="round" paint-order="stroke">Addressed message → claim</text><path d="M797 195V325" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="799" y="262" font-size="16" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" stroke-linejoin="round" paint-order="stroke">May link; not 1:1</text><path d="M797 435V585H665" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#arrow)"/><text x="844" y="496" font-size="16" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" stroke-linejoin="round" paint-order="stroke">Operates on</text><path d="M180 435V585H335" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#arrow)"/><text x="169" y="510" font-size="16" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" stroke-linejoin="round" paint-order="stroke">Project context</text><text x="40" y="645" font-size="15" font-weight="400" text-anchor="start">Mission complete ≠ Run complete ≠ code merged. Mission teammates share one worktree when enabled.</text></g></svg>