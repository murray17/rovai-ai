<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 810" role="img"><title>One implementation and review</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#69737d" stroke-width="1.5"/></marker></defs><rect width="1000" height="810" rx="20" fill="#f7f8fa"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#23313b"><text x="40" y="40" font-size="24" font-weight="650" text-anchor="start">One implementation and review</text><rect x="13" y="70" width="154" height="55" rx="12" fill="white" stroke="#cbd3da"/><text x="90.0" y="100" font-size="20" font-weight="650" text-anchor="middle">User</text><path d="M90 125V730" stroke="#cbd3da" stroke-dasharray="5 6"/><rect x="218" y="70" width="154" height="55" rx="12" fill="white" stroke="#cbd3da"/><text x="295.0" y="100" font-size="20" font-weight="650" text-anchor="middle">Rovai</text><path d="M295 125V730" stroke="#cbd3da" stroke-dasharray="5 6"/><rect x="423" y="70" width="154" height="55" rx="12" fill="white" stroke="#cbd3da"/><text x="500.0" y="100" font-size="20" font-weight="650" text-anchor="middle">Implementer</text><path d="M500 125V730" stroke="#cbd3da" stroke-dasharray="5 6"/><rect x="628" y="70" width="154" height="55" rx="12" fill="white" stroke="#cbd3da"/><text x="705.0" y="100" font-size="20" font-weight="650" text-anchor="middle">Reviewer</text><path d="M705 125V730" stroke="#cbd3da" stroke-dasharray="5 6"/><rect x="833" y="70" width="154" height="55" rx="12" fill="white" stroke="#cbd3da"/><text x="910.0" y="100" font-size="20" font-weight="650" text-anchor="middle">Project files</text><path d="M910 125V730" stroke="#cbd3da" stroke-dasharray="5 6"/><path d="M90 168H295" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#arrow)"/><text x="192.5" y="156" font-size="16" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" stroke-linejoin="round" paint-order="stroke">Select implementer + send scope</text><path d="M295 232H500" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#arrow)"/><text x="397.5" y="220" font-size="16" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" stroke-linejoin="round" paint-order="stroke">Deliver request; claim execution</text><path d="M500 296H910" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#arrow)"/><text x="705.0" y="284" font-size="16" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" stroke-linejoin="round" paint-order="stroke">Edit + check files</text><path d="M500 360H90" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#arrow)"/><text x="295.0" y="348" font-size="16" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" stroke-linejoin="round" paint-order="stroke">Implementation summary and limits</text><path d="M90 424H705" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#arrow)"/><text x="397.5" y="412" font-size="16" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" stroke-linejoin="round" paint-order="stroke">Select reviewer + send review request</text><path d="M705 488H910" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#arrow)"/><text x="807.5" y="476" font-size="16" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" stroke-linejoin="round" paint-order="stroke">Inspect the same files (read-only)</text><path d="M705 552H90" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#arrow)"/><text x="397.5" y="540" font-size="16" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" stroke-linejoin="round" paint-order="stroke">Actual findings or no findings</text><path d="M90 616H500" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="295.0" y="604" font-size="16" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" stroke-linejoin="round" paint-order="stroke">Optional: request a bounded fix</text><path d="M90 680H910" fill="none" stroke="#69737d" stroke-width="1.6" marker-end="url(#arrow)"/><text x="500.0" y="668" font-size="16" font-weight="400" text-anchor="middle" stroke="#f7f8fa" stroke-width="8" stroke-linejoin="round" paint-order="stroke">Inspect the final page and changes</text><text x="40" y="778" font-size="16" font-weight="400" text-anchor="start">This example uses user-directed handoff. Selecting several recipients does not create this sequence.</text></g></svg>